<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 认识水果蔬菜</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #FF8C42;
            --bg-gradient: linear-gradient(135deg, #FFF8E1 0%, #E8F5E9 100%);
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: fit-content;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🍎 小豆中文</h1>
        <p>今天我们来认识水果蔬菜</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击水果蔬菜，听听它们的名字～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="filterItems('all')">全部</button>
        <button class="filter-btn" data-filter="fruit" onclick="filterItems('fruit')">🍎 水果</button>
        <button class="filter-btn" data-filter="vegetable" onclick="filterItems('vegetable')">🥬 蔬菜</button>
    </div>
    <div class="main-stage">
        <div id="itemCards"></div>
        <div class="nav-btns">
            <button class="nav-btn" id="prevBtn" onclick="prevItem()">⬅️ 上一个</button>
            <button class="nav-btn" id="nextBtn" onclick="nextItem()">下一个 ➡️</button>
        </div>
        <div class="progress" id="progressDots"></div>
        <div style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
<script src="js/common.js"></script>
    <script>
        let allItems = [];
        let filteredItems = [];
        let currentIndex = 0;
        let currentFilter = 'all';

        async function init() {
            try {
                const data = await XiaoDou.loadModule('fruit_vegetable');
                allItems = XiaoDou.getItems(data).map(item => {
                    item.measure = item.measure_word || item.measure || '';
                    item.file = item.file || item.english || '';
                    item.japanese = item.japanese || '';
                    item.japanese_reading = item.japanese_reading || item.japanese || '';
                    return item;
                });
                filteredItems = [...allItems];
                renderCards();
                setupSwipe();
                updateArrowState();
            } catch (err) {
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">水果蔬菜数据加载失败，请刷新再试～</div>';
                console.error(err);
            }
        }

        function stopAllAudio() {
            document.querySelectorAll('audio').forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function playAudio(path) {
            return new Promise((resolve, reject) => {
                const audio = new Audio(XiaoDou.resolvePath(path));
                audio.onended = resolve;
                audio.onerror = reject;
                audio.play().catch(reject);
            });
        }

        function speakWithFallback(text, mp3Path, lang = 'zh', rate = 0.8) {
            stopAllAudio();
            if (mp3Path) {
                playAudio(mp3Path).catch(() => XiaoDou.speak(text, lang, rate));
            } else {
                XiaoDou.speak(text, lang, rate);
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function filterItems(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === tag);
            });
            if (tag === 'all') {
                filteredItems = [...allItems];
            } else {
                filteredItems = allItems.filter(item => (item.tags || []).includes(tag));
            }
            currentIndex = 0;
            renderCards();
            showMascot(tag === 'all' ? '全部水果蔬菜都在这里啦！' : tag === 'fruit' ? '我们来看看好吃的水果！' : '我们来看看健康的蔬菜！');
        }

        function renderCards() {
            const container = document.getElementById('itemCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            filteredItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card' + (index === 0 ? ' active' : '');
                const emoji = (item.tags || []).includes('fruit') ? '🍎' : '🥬';
                const svgFallback = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Crect fill='%23f0f0f0' width='240' height='240'/%3E%3Ctext x='120' y='150' font-size='90' text-anchor='middle'%3E" + emoji + "%3C/text%3E%3C/svg%3E";
                const hasJapanese = !!item.japanese;
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="event.stopPropagation(); prevItem();">◀</button>
                        <img class="item-image" src="${XiaoDou.resolvePath(`assets/images/fruits_vegetables/${item.file}.png`)}" alt="${XiaoDou.escapeHtml(item.word)}" onerror="this.src='${svgFallback}'" onclick="playWord(${index})">
                        <button class="side-arrow right" onclick="event.stopPropagation(); nextItem();">▶</button>
                    </div>
                    <div class="item-word">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="item-pinyin">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="item-english">${XiaoDou.escapeHtml(item.english)} · 一${XiaoDou.escapeHtml(item.measure)}</div>
                    <div class="item-japanese">${hasJapanese ? `${XiaoDou.escapeHtml(item.word)} → ${XiaoDou.escapeHtml(item.japanese)}（${XiaoDou.escapeHtml(item.japanese_reading)}）` : ''}</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        <button class="btn btn-measure" onclick="playMeasure(${index})">📏 量词</button>
                        ${hasJapanese ? `<button class="btn btn-japanese" onclick="playJapaneseWord(${index})">🇯🇵 日语</button>` : ''}
                        <button class="btn btn-english" onclick="playEnglishWord(${index})">🇺🇸 英语</button>
                        <button class="btn btn-encyclopedia" onclick="playEncyclopedia(${index})">📖 百科</button>
                    </div>
                    <div class="encyclopedia-card" id="encyclopedia-${index}" style="display:none;">
                        <div class="encyclopedia-title">📖 ${XiaoDou.escapeHtml(item.word)} 小百科</div>
                        <div class="encyclopedia-item"><strong>简介：</strong>${XiaoDou.escapeHtml(item.intro || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>在哪里：</strong>${XiaoDou.escapeHtml(item.where || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>有什么用：</strong>${XiaoDou.escapeHtml(item.use || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>小知识：</strong>${XiaoDou.escapeHtml(item.fun_fact || '待补充')}</div>
                    </div>`;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateArrowState();
        }

        function updateArrowState() {
            const activeCard = document.querySelector('.item-card.active');
            const prevArrow = activeCard ? activeCard.querySelector('.side-arrow.left') : null;
            const nextArrow = activeCard ? activeCard.querySelector('.side-arrow.right') : null;
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            if (prevArrow) prevArrow.disabled = currentIndex === 0;
            if (nextArrow) nextArrow.disabled = currentIndex === filteredItems.length - 1;
            if (prevBtn) prevBtn.disabled = currentIndex === 0;
            if (nextBtn) nextBtn.disabled = currentIndex === filteredItems.length - 1;
        }

        function playWord(index) {
            const item = filteredItems[index];
            const mp3Path = `assets/audio/fruits_vegetables/${item.file}_word.mp3`;
            // 只读词语本身，避免 TTS 把拼音读成英文
            speakWithFallback(item.word, mp3Path, 'zh');
            showMascot(`我们来看看：${item.word}，${item.pinyin}。`);
        }

        function playSentence(index) {
            const item = filteredItems[index];
            const mp3Path = `assets/audio/fruits_vegetables/sentences/${item.file}_sentence.mp3`;
            const text = item.sentence || '';
            speakWithFallback(text, mp3Path, 'zh');
            showMascot(text);
        }

        function playMeasure(index) {
            const item = filteredItems[index];
            const text = `${item.word}的量词是${item.measure}，一${item.measure}${item.word}。`;
            speakWithFallback(text, null, 'zh');
            showMascot(text);
        }

        function playJapaneseWord(index) {
            const item = filteredItems[index];
            if (!item.japanese_reading) return;
            const mp3Path = `assets/audio/fruits_vegetables/japanese/${item.file}_japanese.mp3`;
            speakWithFallback(item.japanese_reading, mp3Path, 'ja');
            showMascot(`日语：${item.word} → ${item.japanese}（${item.japanese_reading}）`);
        }

        function playEnglishWord(index) {
            const item = filteredItems[index];
            speakWithFallback(item.english, null, 'en', 0.85);
            showMascot(`英语：${item.word} → ${item.english}`);
        }

        function playEncyclopedia(index) {
            const item = filteredItems[index];
            if (!item.intro) {
                showMascot(`${item.word} 的百科内容还在准备中，先听听别的吧～`);
                return;
            }
            const text = `${item.word}。${item.intro}${item.where}${item.use}${item.fun_fact}`;
            speakWithFallback(text, null, 'zh', 0.8);
            showMascot(`${item.word}的小百科：${item.intro}`);

            const card = document.getElementById(`encyclopedia-${index}`);
            if (card) {
                document.querySelectorAll('.encyclopedia-card').forEach(el => {
                    if (el.id !== `encyclopedia-${index}`) el.style.display = 'none';
                });
                card.style.display = card.style.display === 'none' ? 'block' : 'none';
            }
        }

        function switchItem(direction) {
            const cards = document.querySelectorAll('.item-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (cards.length === 0) return;
            let newIndex;
            if (direction === 'next') {
                newIndex = (currentIndex + 1) % filteredItems.length;
            } else {
                newIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
            }
            cards[currentIndex].classList.remove('active');
            cards[currentIndex].classList.remove('slide-left-in', 'slide-right-in');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            dots[currentIndex].classList.remove('active');
            currentIndex = newIndex;
            cards[currentIndex].classList.remove('slide-left-out', 'slide-right-out');
            cards[currentIndex].classList.add('active');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            dots[currentIndex].classList.add('active');
            updateArrowState();
            const item = filteredItems[currentIndex];
            showMascot(`我们来学${item.word}！`);
            setTimeout(() => playWord(currentIndex), 500);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }

        let touchStartX = 0;
        let touchEndX = 0;
        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;
            mainStage.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            mainStage.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }
        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const swipeThreshold = 50;
            if (touchStartX - touchEndX > swipeThreshold) nextItem();
            else if (touchEndX - touchStartX > swipeThreshold) prevItem();
        }

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'fruit_vegetable_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
    </script></body>
</html>
