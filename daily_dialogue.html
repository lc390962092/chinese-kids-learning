<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 日常情景对话</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css?v=2">
    <style>
        :root {
            --primary-color: #7E57C2;
            --bg-gradient: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%);
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: fit-content;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🗣️ 小豆中文</h1>
        <p>今天我们来学日常情景对话</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击句子，跟小豆一起说中文～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="filterItems('all')">全部</button>
        <button class="filter-btn" data-filter="polite" onclick="filterItems('polite')">🙋 礼貌用语</button>
        <button class="filter-btn" data-filter="eatdrink" onclick="filterItems('eatdrink')">🍚 吃喝</button>
        <button class="filter-btn" data-filter="daily" onclick="filterItems('daily')">🏠 日常生活</button>
        <button class="filter-btn" data-filter="emotion" onclick="filterItems('emotion')">😊 心情</button>
        <button class="filter-btn" data-filter="play" onclick="filterItems('play')">🎈 游戏</button>
    </div>
    <div class="main-stage">
        <div id="loading" class="loading">正在加载情景对话...</div>
        <div id="error" class="error" style="display:none;">加载失败，请检查网络后刷新。</div>
        <div id="itemCards" style="display:none;"></div>
        <div class="progress" id="progressDots" style="display:none;"></div>
        <div class="nav-btns" id="navButtons" style="display:none;">
            <button class="nav-btn" id="prevBtn" onclick="prevItem()">⬅️ 上一个</button>
            <button class="nav-btn" id="nextBtn" onclick="nextItem()">下一个 ➡️</button>
        </div>
        <div style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script>
        let allItems = [];
        let filteredItems = [];
        let currentIndex = 0;
        let currentFilter = 'all';

        async function init() {
            try {
                const data = await XiaoDou.loadModule('daily_dialogue');
                allItems = XiaoDou.getItems(data);
                if (!allItems.length) throw new Error('没有数据');
                filteredItems = [...allItems];
                document.getElementById('loading').style.display = 'none';
                document.getElementById('itemCards').style.display = 'block';
                document.getElementById('progressDots').style.display = 'flex';
                document.getElementById('navButtons').style.display = 'flex';
                renderCards();
                setupSwipe();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                console.error(err);
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function filterItems(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === tag);
            });
            if (tag === 'all') {
                filteredItems = [...allItems];
            } else {
                filteredItems = allItems.filter(item => item.tags && item.tags.includes(tag));
            }
            currentIndex = 0;
            renderCards();
            showMascot(tag === 'all' ? '全部情景对话都在这里啦！' : tag === 'polite' ? '我们要做一个有礼貌的小朋友！' : tag === 'eatdrink' ? '来看看每天吃什么、喝什么！' : tag === 'daily' ? '日常生活里常常这样说～' : '和小伙伴一起玩，学会表达心情！');
        }

        function renderCards() {
            const container = document.getElementById('itemCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            filteredItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card' + (index === 0 ? ' active' : '');
                const emoji = (item.tags || []).includes('polite') ? '🙋' : (item.tags || []).includes('eatdrink') ? '🍚' : (item.tags || []).includes('daily') ? '🏠' : '🎈';
                const svgFallback = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Crect fill='%23f0f0f0' width='240' height='240'/%3E%3Ctext x='120' y='150' font-size='90' text-anchor='middle'%3E" + emoji + "%3C/text%3E%3C/svg%3E";
                const w = XiaoDou.escapeHtml(item.word);
                const p = XiaoDou.escapeHtml(item.pinyin);
                const e = XiaoDou.escapeHtml(item.english);
                const s = XiaoDou.escapeHtml(item.sentence);
                const j = XiaoDou.escapeHtml(item.japanese);
                const jr = XiaoDou.escapeHtml(item.japanese_reading);
                const f = XiaoDou.escapeHtml(item.file);
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" id="prevArrow" onclick="prevItem()">◀</button>
                        <img class="item-image" src="assets/images/daily_dialogue/${f}.png" alt="${w}" onerror="this.src='${svgFallback}'" onclick="playWord(${index})">
                        <button class="side-arrow right" id="nextArrow" onclick="nextItem()">▶</button>
                    </div>
                    <div class="item-word">${w}</div>
                    <div class="item-pinyin">${p}</div>
                    <div class="item-english">${e}</div>
                    <div class="item-sentence">${s}</div>
                    <div class="item-japanese">${w} → ${j}（${jr}）</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        <button class="btn btn-japanese" onclick="playJapaneseWord(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglishWord(${index})">🇺🇸 英语</button>
                    </div>`;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateArrowState();
        }

        function updateArrowState() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            if (prevBtn) prevBtn.disabled = filteredItems.length <= 1 || currentIndex === 0;
            if (nextBtn) nextBtn.disabled = filteredItems.length <= 1 || currentIndex === filteredItems.length - 1;
        }

        function playWord(index) {
            const item = filteredItems[index];
            const mp3Path = `assets/audio/daily_dialogue/${item.file}_word.mp3`;
            XiaoDou.playAudio(mp3Path, item.word, 'zh');
            showMascot(`我们来看看：${item.word}，${item.pinyin}。`);
        }

        function playSentence(index) {
            const item = filteredItems[index];
            const mp3Path = `assets/audio/daily_dialogue/sentences/${item.file}_sentence.mp3`;
            XiaoDou.playAudio(mp3Path, item.sentence, 'zh');
            showMascot(item.sentence);
        }

        function playJapaneseWord(index) {
            const item = filteredItems[index];
            const mp3Path = `assets/audio/daily_dialogue/japanese/${item.file}_japanese.mp3`;
            XiaoDou.playAudio(mp3Path, item.japanese_reading, 'ja');
            showMascot(`日语：${item.word} → ${item.japanese}（${item.japanese_reading}）`);
        }

        function playEnglishWord(index) {
            const item = filteredItems[index];
            const mp3Path = `assets/audio/daily_dialogue/english/${item.file}_english.mp3`;
            XiaoDou.playAudio(mp3Path, item.english, 'en');
            showMascot(`英语：${item.word} → ${item.english}`);
        }

        function switchItem(direction) {
            const cards = document.querySelectorAll('.item-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (cards.length === 0) return;
            let newIndex;
            if (direction === 'next') {
                newIndex = (currentIndex + 1) % filteredItems.length;
            } else {
                newIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
            }
            cards[currentIndex].classList.remove('active');
            cards[currentIndex].classList.remove('slide-left-in', 'slide-right-in');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            dots[currentIndex].classList.remove('active');
            currentIndex = newIndex;
            cards[currentIndex].classList.remove('slide-left-out', 'slide-right-out');
            cards[currentIndex].classList.add('active');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            dots[currentIndex].classList.add('active');
            updateArrowState();
            const item = filteredItems[currentIndex];
            showMascot(`我们来学${item.word}！`);
            setTimeout(() => playWord(currentIndex), 500);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }

        let touchStartX = 0;
        let touchEndX = 0;
        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;
            mainStage.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            mainStage.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }
        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const swipeThreshold = 50;
            if (touchStartX - touchEndX > swipeThreshold) nextItem();
            else if (touchEndX - touchStartX > swipeThreshold) prevItem();
        }

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'daily_dialogue_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
    </script>
</body>
</html>
