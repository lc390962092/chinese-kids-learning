<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 季节和天气</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #1976D2;
            --bg-gradient: linear-gradient(135deg, #E3F2FD 0%, #E8F5E9 100%);
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: fit-content;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🌤️ 小豆中文</h1>
        <p>今天我们来认识季节和天气</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击天气卡片，听听它们的名字～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="filterItems('all')">全部</button>
        <button class="filter-btn" data-filter="season" onclick="filterItems('season')">🌸 季节</button>
        <button class="filter-btn" data-filter="weather" onclick="filterItems('weather')">☀️ 天气</button>
    </div>
    <div class="main-stage">
        <div id="itemCards"></div>
        <div class="nav-btns">
            <button class="nav-btn" id="prevBtn" onclick="prevItem()">⬅️ 上一个</button>
            <button class="nav-btn" id="nextBtn" onclick="nextItem()">下一个 ➡️</button>
        </div>
        <div class="progress" id="progressDots"></div>
        <div style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
<script src="js/common.js"></script>
    <script>
        let allItems = [];
        let filteredItems = [];
        let currentIndex = 0;
        let currentFilter = 'all';

        async function init() {
            try {
                const data = await XiaoDou.loadModule('seasons_weather');
                allItems = XiaoDou.getItems(data).map(item => {
                    item.sentence = item.sentence || item.summary || '';
                    item.file = item.file || item.english || '';
                    return item;
                });
                filteredItems = [...allItems];
                renderCards();
                updateMascot('你好！点击天气卡片，听听它们的名字～');
            } catch (err) {
                console.error('加载数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">季节天气数据加载失败，请刷新再试～</div>';
            }
        }

        function stopSpeech() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function speak(text, lang = 'zh') {
            XiaoDou.speak(text, lang);
        }

        const JAPANESE_NAMES = {
            'spring': { ja: '春', reading: 'はる' },
            'summer': { ja: '夏', reading: 'なつ' },
            'autumn': { ja: '秋', reading: 'あき' },
            'winter': { ja: '冬', reading: 'ふゆ' },
            'sunny': { ja: '晴れ', reading: 'はれ' },
            'cloudy': { ja: '曇り', reading: 'くもり' },
            'partly_cloudy': { ja: '曇り時々晴れ', reading: 'くもりときどきはれ' },
            'rainy': { ja: '雨', reading: 'あめ' },
            'snowy': { ja: '雪', reading: 'ゆき' },
            'windy': { ja: '風が強い', reading: 'かぜがつよい' },
            'thunder': { ja: '雷', reading: 'かみなり' },
            'lightning': { ja: '稲妻', reading: 'いなずま' },
            'rainbow': { ja: '虹', reading: 'にじ' },
            'fog': { ja: '霧', reading: 'きり' },
            'frost': { ja: '霜', reading: 'しも' },
            'hail': { ja: '雹', reading: 'ひょう' }
        };

        const ENCYCLOPEDIA_TEXT = {
            'spring': '春天是万物复苏的季节，气温慢慢升高，植物开始发芽开花。',
            'summer': '夏天是一年中最热的季节，白天长夜晚短，很多水果都成熟了。',
            'autumn': '秋天的天气变凉爽，树叶会变黄变红，是收获的季节。',
            'winter': '冬天是一年中最冷的季节，北方会下雪，小动物会冬眠。',
            'sunny': '晴天时阳光充足，太阳能帮助人体合成维生素D，让人心情变好。',
            'cloudy': '阴天时太阳被云层遮住，光线柔和，不容易晒伤。',
            'partly_cloudy': '多云天气时，天空有一部分被云遮住，太阳会时隐时现。',
            'rainy': '下雨天，空气中的水汽凝结成雨滴落下来，滋润大地。',
            'snowy': '下雪天，水蒸气在空中直接变成冰晶飘落，会形成白白的雪花。',
            'windy': '刮风天，空气流动形成风，风力太强的时候叫大风或台风。',
            'thunder': '打雷是云层之间放电时产生的巨大声响，通常伴随闪电。',
            'lightning': '闪电是云层放电时发出的强光，速度比声音快很多。',
            'rainbow': '彩虹是阳光穿过雨滴时发生折射和反射形成的七彩光带。',
            'fog': '雾是空气中很多小水滴聚集在近地面，让能见度变低的天气现象。',
            'frost': '霜是水蒸气在低温物体表面直接凝华成的小冰晶，像一层白糖。',
            'hail': '冰雹是强对流天气中形成的冰块，从云中掉下来时会蹦蹦跳跳。'
        };

        function playWord(index) {
            const item = filteredItems[index];
            stopSpeech();
            XiaoDou.playAudio(`assets/audio/seasons_weather/${item.file}_word.mp3`, item.word, 'zh');
            updateMascot(`正在朗读：${item.word}`);
        }

        function playSentence(index) {
            const item = filteredItems[index];
            stopSpeech();
            XiaoDou.playAudio(`assets/audio/seasons_weather/sentences/${item.file}_sentence.mp3`, item.sentence, 'zh');
            updateMascot(`正在朗读句子：${item.sentence}`);
        }

        function playEnglish(index) {
            const item = filteredItems[index];
            const english = item.english || (item.file || '').replace(/_/g, ' ');
            stopSpeech();
            XiaoDou.speak(english, 'en', 0.85);
            updateMascot(`English: ${english}`);
        }

        function playJapanese(index) {
            const item = filteredItems[index];
            const jp = JAPANESE_NAMES[item.english] || { ja: item.word, reading: '' };
            stopSpeech();
            XiaoDou.speak(jp.ja, 'ja', 0.85);
            updateMascot(`日语：${jp.ja}（${jp.reading}）`);
        }

        function toggleEncyclopedia(index) {
            const card = document.getElementById(`card-${index}`);
            const box = card.querySelector('.encyclopedia-box');
            box.classList.toggle('show');
            if (box.classList.contains('show')) {
                stopSpeech();
                XiaoDou.speak(box.textContent, 'zh');
            }
        }

        function updateMascot(text) {
            document.getElementById('mascotText').textContent = text;
        }

        function renderCards() {
            const container = document.getElementById('itemCards');
            container.innerHTML = '';
            filteredItems.forEach((item, index) => {
                const jp = JAPANESE_NAMES[item.english] || { ja: item.word, reading: '' };
                const card = document.createElement('div');
                card.className = 'item-card' + (index === currentIndex ? ' active' : '');
                card.id = `card-${index}`;
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="prevItem()">◀</button>
                        <img loading="lazy" class="item-image" src="${XiaoDou.resolvePath(`assets/images/seasons_weather/${item.file}.webp`)}" alt="${XiaoDou.escapeHtml(item.word)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22%3E%3Crect width=%22240%22 height=%22240%22 fill=%22%23f0f0f0%22/%3E%3Ctext x=%22120%22 y=%22125%22 font-size=%2250%22 text-anchor=%22middle%22%3E${XiaoDou.escapeHtml(item.word.charAt(0))}%3C/text%3E%3C/svg%3E'" onclick="playWord(${index})">
                        <button class="side-arrow right" onclick="nextItem()">▶</button>
                    </div>
                    <div class="item-word" onclick="playWord(${index})">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="item-pinyin">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="item-english">${XiaoDou.escapeHtml(item.english)}</div>
                    <div class="item-japanese" onclick="playJapanese(${index})">${XiaoDou.escapeHtml(jp.ja)} <span class="item-japanese-reading">${XiaoDou.escapeHtml(jp.reading)}</span></div>
                    <div class="item-sentence" onclick="playSentence(${index})">${XiaoDou.escapeHtml(item.sentence)}</div>
                    <div class="encyclopedia-box" id="ency-${index}">
                        <strong>📚 小知识：</strong>${XiaoDou.escapeHtml(ENCYCLOPEDIA_TEXT[item.english] || '暂无百科内容')}
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 中文</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📖 句子</button>
                        <button class="btn btn-english" onclick="playEnglish(${index})">🇺🇸 英语</button>
                        <button class="btn btn-japanese" onclick="playJapanese(${index})">🇯🇵 日语</button>
                        <button class="btn btn-encyclopedia" onclick="toggleEncyclopedia(${index})">📚 百科</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateProgress();
            updateNavButtons();
        }

        function updateProgress() {
            const dotsContainer = document.getElementById('progressDots');
            dotsContainer.innerHTML = '';
            filteredItems.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = 'progress-dot' + (index === currentIndex ? ' active' : '');
                dotsContainer.appendChild(dot);
            });
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentIndex <= 0;
            document.getElementById('nextBtn').disabled = currentIndex >= filteredItems.length - 1;
        }

        function showCard(index, direction) {
            const cards = document.querySelectorAll('.item-card');
            const oldCard = cards[currentIndex];
            const newCard = cards[index];
            if (oldCard && newCard) {
                oldCard.classList.add(direction > 0 ? 'slide-left-out' : 'slide-right-out');
                setTimeout(() => {
                    oldCard.classList.remove('active', 'slide-left-out', 'slide-right-out');
                    newCard.classList.add('active', direction > 0 ? 'slide-left-in' : 'slide-right-in');
                    setTimeout(() => newCard.classList.remove('slide-left-in', 'slide-right-in'), 300);
                }, 280);
            } else {
                if (oldCard) oldCard.classList.remove('active');
                if (newCard) newCard.classList.add('active');
            }
            currentIndex = index;
            updateProgress();
            updateNavButtons();
            const jp = JAPANESE_NAMES[filteredItems[currentIndex].english] || { ja: '', reading: '' };
            updateMascot(`现在学习：${filteredItems[currentIndex].word} ${jp.ja ? '· ' + jp.ja + '（' + jp.reading + '）' : ''}`);
            // 翻页自动朗读中文词语
            setTimeout(() => playWord(currentIndex), 350);
        }

        function nextItem() {
            if (currentIndex < filteredItems.length - 1) showCard(currentIndex + 1, 1);
        }

        function prevItem() {
            if (currentIndex > 0) showCard(currentIndex - 1, -1);
        }

        function filterItems(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === type);
            });
            if (type === 'all') filteredItems = [...allItems];
            else filteredItems = allItems.filter(item => (item.tags || []).includes(type));
            currentIndex = 0;
            renderCards();
            updateMascot(type === 'all' ? '全部季节和天气' : (type === 'season' ? '季节' : '天气'));
        }

        let touchStartX = 0, touchEndX = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const threshold = 50;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > threshold) {
                if (diff > 0) nextItem(); else prevItem();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') nextItem();
            if (e.key === 'ArrowLeft') prevItem();
        });

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'seasons_weather_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
    </script></body>
</html>
