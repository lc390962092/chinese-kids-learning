<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我是大侦探</title>
  <link rel="stylesheet" href="css/detective.css?v=1">
</head>
<body>
  <div class="app">
    <header class="detective-header">
      <div class="mascot">🕵️‍♂️</div>
      <div>
        <h1>我是大侦探</h1>
        <p class="subtitle">观察 · 推理 · 破案</p>
      </div>
    </header>

    <main id="main">
      <section class="hero-card">
        <img id="hero-img" src="assets/images/detective/hero-detective.png" alt="小侦探" onerror="this.style.display='none'">
        <div class="hero-text">
          <h2>欢迎来到侦探事务所</h2>
          <p>这里有神秘的案件等你破解。仔细观察线索，找出真相，赢取侦探徽章！</p>
        </div>
      </section>

      <section class="menu">
        <h3>🎮 训练与案件</h3>
        <div class="menu-grid">
          <a class="menu-btn" href="detective_observe.html">
            <span class="icon">👀</span>
            <span class="label">观察训练营</span>
            <span class="desc">找出场景中不对的地方</span>
          </a>
          <a class="menu-btn" href="detective_case.html?id=cake-thief">
            <span class="icon">🍰</span>
            <span class="label">蛋糕小偷</span>
            <span class="desc">谁偷吃了蛋糕？</span>
          </a>
          <a class="menu-btn" href="detective_case.html?id=library-book">
            <span class="icon">📚</span>
            <span class="label">图书馆失窃案</span>
            <span class="desc">丢失的书在哪里？</span>
          </a>
          <a class="menu-btn" href="detective_case.html?id=garden-mystery">
            <span class="icon">🌻</span>
            <span class="label">神秘花园事件</span>
            <span class="desc">花园里发生了什么？</span>
          </a>
        </div>
      </section>

      <section class="badge-board">
        <h3>🏅 我的侦探徽章</h3>
        <div id="badges" class="badges">
          <p class="empty">还没有徽章，快去破案吧！</p>
        </div>
      </section>
    </main>

    <footer class="detective-footer">
      <a href="index.html">← 返回小豆学习首页</a>
    </footer>
  </div>

  <script src="js/common.js"></script>
  <script src="js/detective.js"></script>
  <script>
    Detective.renderHome();
  </script>
</body>
</html>
