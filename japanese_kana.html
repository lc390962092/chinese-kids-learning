<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 日语假名</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #FF7043;
            --bg-gradient: linear-gradient(135deg, #FFF3E0 0%, #FCE4EC 100%);
        }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆日语假名</h1>
        <p>平假名 ⇄ 片假名 · 清音 · 浊音 · 拗音 · 特殊</p>
    </div>

    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！我是小豆，今天我们一起学日语假名，看看平假名和片假名怎么配对吧！</div>
        <div class="mascot-avatar">🐼</div>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn active" data-mode="pair" onclick="setMode('pair')">配对一起学</button>
        <button class="mode-btn" data-mode="hiragana" onclick="setMode('hiragana')">只学平假名</button>
        <button class="mode-btn" data-mode="katakana" onclick="setMode('katakana')">只学片假名</button>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-section="seion">清音</button>
        <button class="tab-btn" data-section="dakuon">浊音</button>
        <button class="tab-btn" data-section="yoon">拗音</button>
        <button class="tab-btn" data-section="special">特殊</button>
    </div>

    <div class="main-stage">
        <div class="card-wrapper">
            <button class="side-arrow left" id="prevBtn" onclick="prevItem()" aria-label="上一个">◀</button>
            <div id="cardContainer"></div>
            <button class="side-arrow right" id="nextBtn" onclick="nextItem()" aria-label="下一个">▶</button>
        </div>

        <a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#888;text-decoration:none;font-size:14px;">← 回首页</a>

        <div class="progress" id="progressDots"></div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let kanaData = { seion: [], dakuon: [], yoon: [], special: [] };
        let currentSection = 'seion';
        let currentIndex = 0;
        let appStarted = false;
        let displayMode = 'pair'; // 'pair' | 'hiragana' | 'katakana'

        async function init() {
            try {
                const data = await XiaoDou.loadModule('japanese_kana');
                for (const sec of (data.sections || [])) {
                    if (kanaData[sec.id]) kanaData[sec.id] = sec.items || [];
                }
                renderTabs();
                renderCard();
                updateNavButtons();
                setupSwipe();
            } catch (err) {
                console.error('加载假名数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">假名数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function getAudioPath(section, index) {
            const item = kanaData[section][index];
            // 平假名和片假名发音相同，统一用平假名音频文件
            let key = item.hiragana || item.romaji || 'special';
            key = key.replace(/ー/g, '-').replace(/ッ/g, 'xtsu').replace(/っ/g, 'xtsu').replace(/ン/g, 'nn').replace(/ん/g, 'nn');
            return XiaoDou.resolvePath(`assets/audio/japanese_kana/${section}/${String(index).padStart(2, '0')}_${key}.mp3`);
        }

        function playKanaAudio(path, fallbackText) {
            XiaoDou.playAudio(path, fallbackText, 'ja');
        }

        function renderTabs() {
            const tabNames = { seion: '清音', dakuon: '浊音', yoon: '拗音', special: '特殊' };
            const tabs = document.getElementById('tabs');
            tabs.innerHTML = '';
            for (const key of ['seion', 'dakuon', 'yoon', 'special']) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (key === currentSection ? ' active' : '');
                btn.textContent = tabNames[key];
                btn.onclick = () => switchSection(key);
                tabs.appendChild(btn);
            }
        }

        function setMode(mode) {
            displayMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            renderCard();
            playCurrent();
        }

        function renderCard() {
            const container = document.getElementById('cardContainer');
            const section = kanaData[currentSection];
            if (!section || section.length === 0) return;
            const item = section[currentIndex];
            let html = '';
            if (currentSection === 'special') {
                const mainKana = displayMode === 'katakana' ? item.katakana : item.hiragana;
                const pairKana = displayMode === 'pair' ? item.katakana : '';
                const pairHtml = pairKana && pairKana !== mainKana ? `<div class="big-kana katakana" onclick="playCurrent()">${XiaoDou.escapeHtml(pairKana)}</div>` : '';
                html = `
                    <div class="kana-label">${displayMode === 'katakana' ? '片假名' : '平假名'}</div>
                    <div class="big-kana hiragana" onclick="playCurrent()">${XiaoDou.escapeHtml(mainKana)}</div>
                    ${pairHtml}
                    <div class="romaji">${XiaoDou.escapeHtml(item.romaji)}</div>
                    <div class="special-info"><strong>${XiaoDou.escapeHtml(item.name)}</strong>：${XiaoDou.escapeHtml(item.description)}</div>
                    <div class="example-word">${XiaoDou.escapeHtml(item.example_word)}</div>
                    <div class="example-meaning">${XiaoDou.escapeHtml(item.example_meaning)}</div>
                    <button class="btn-play" onclick="playCurrent()">🔊 朗读</button>
                `;
            } else {
                if (displayMode === 'pair') {
                    html = `
                        <div class="kana-pair-row">
                            <div>
                                <div class="kana-label">平假名</div>
                                <div class="big-kana hiragana" onclick="playCurrent()">${XiaoDou.escapeHtml(item.hiragana)}</div>
                            </div>
                            <div class="kana-connector">⇄</div>
                            <div>
                                <div class="kana-label">片假名</div>
                                <div class="big-kana katakana" onclick="playCurrent()">${XiaoDou.escapeHtml(item.katakana)}</div>
                            </div>
                        </div>
                        <div class="romaji">${XiaoDou.escapeHtml(item.romaji)}</div>
                        <div class="example-word">${XiaoDou.escapeHtml(item.example_word)}</div>
                        <div class="example-meaning">${XiaoDou.escapeHtml(item.example_meaning)}</div>
                        <button class="btn-play" onclick="playCurrent()">🔊 朗读</button>
                    `;
                } else {
                    const isKata = displayMode === 'katakana';
                    const label = isKata ? '片假名' : '平假名';
                    const kana = isKata ? item.katakana : item.hiragana;
                    const pairLabel = isKata ? '平假名' : '片假名';
                    const pair = isKata ? item.hiragana : item.katakana;
                    html = `
                        <div class="kana-label">${label}</div>
                        <div class="big-kana ${isKata ? 'katakana' : 'hiragana'}" onclick="playCurrent()">${XiaoDou.escapeHtml(kana)}</div>
                        <div style="font-size:18px;color:#888;margin:5px 0;">${pairLabel}：${XiaoDou.escapeHtml(pair)}</div>
                        <div class="romaji">${XiaoDou.escapeHtml(item.romaji)}</div>
                        <div class="example-word">${XiaoDou.escapeHtml(item.example_word)}</div>
                        <div class="example-meaning">${XiaoDou.escapeHtml(item.example_meaning)}</div>
                        <button class="btn-play" onclick="playCurrent()">🔊 朗读</button>
                    `;
                }
            }
            container.innerHTML = html;
            renderProgress();
            updateNavButtons();
        }

        function renderProgress() {
            const progress = document.getElementById('progressDots');
            const count = kanaData[currentSection].length;
            progress.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (i === currentIndex ? ' active' : '');
                progress.appendChild(dot);
            }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = false;
            document.getElementById('nextBtn').disabled = false;
        }

        function playCurrent() {
            const item = kanaData[currentSection][currentIndex];
            let text = '';
            let mp3Path = '';
            if (currentSection === 'special') {
                const main = displayMode === 'katakana' ? item.katakana : item.hiragana;
                text = `${main}、${item.name}、${item.example_word}`;
                mp3Path = getAudioPath(currentSection, currentIndex);
                showMascot(`${item.name}：${item.description}。比如 ${item.example_word}，${item.example_meaning}。`);
            } else {
                text = `${item.hiragana}、${item.katakana}、${item.romaji}、${item.example_word}`;
                mp3Path = getAudioPath(currentSection, currentIndex);
                showMascot(`${item.hiragana}，片假名是 ${item.katakana}，都读作 ${item.romaji}。例词：${item.example_word}，意思是 ${item.example_meaning}。`);
            }
            playKanaAudio(mp3Path, text);
        }

        function switchSection(section) {
            currentSection = section;
            currentIndex = 0;
            renderTabs();
            renderCard();
            updateNavButtons();
            const names = { seion: '清音', dakuon: '浊音', yoon: '拗音', special: '特殊' };
            showMascot(`我们来学${names[section]}！`);
        }

        function switchItem(direction) {
            const section = kanaData[currentSection];
            const oldCard = document.getElementById('cardContainer').firstElementChild;
            let newIndex = currentIndex;
            if (direction === 'next') newIndex = (currentIndex + 1) % section.length;
            else if (direction === 'prev') newIndex = (currentIndex - 1 + section.length) % section.length;
            if (newIndex === currentIndex) return;
            if (oldCard) {
                oldCard.classList.remove('slide-left-in', 'slide-right-in');
                oldCard.classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            }
            currentIndex = newIndex;
            renderCard();
            const newCard = document.getElementById('cardContainer').firstElementChild;
            if (newCard) {
                newCard.classList.remove('slide-left-out', 'slide-right-out');
                newCard.classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            }
            updateNavButtons();
            setTimeout(playCurrent, 300);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }

        let touchStartX = 0, touchEndX = 0;
        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;
            mainStage.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            mainStage.addEventListener('touchend', function(e) { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });
            let mouseDown = false;
            mainStage.addEventListener('mousedown', function(e) { mouseDown = true; touchStartX = e.screenX; });
            mainStage.addEventListener('mouseup', function(e) { if (!mouseDown) return; mouseDown = false; touchEndX = e.screenX; handleSwipe(); });
            mainStage.addEventListener('mouseleave', function() { mouseDown = false; });
        }

        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > swipeThreshold) { if (diff > 0) nextItem(); else prevItem(); }
        }

        function startApp() {
            if (appStarted) return;
            appStarted = true;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
            }
            const silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
            silentAudio.play().catch(() => {});
            showMascot('你好！我是小豆。我们先从清音开始，看看平假名和片假名怎么配对吧！');
            XiaoDou.speak('你好！我是小豆。我们先从清音开始，看看平假名和片假名怎么配对吧！', 'zh');
        }

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'japanese_kana_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
        startApp();
    </script>
</body>
</html>
