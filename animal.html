<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 认识动物</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #FF6B6B;
            --bg-gradient: linear-gradient(135deg, #FFF8E7 0%, #FFF0F5 100%);
        }
        body {
            /* 禁止浏览器级左右滑返回/前进（iOS Safari / Chrome 手势导航） */
            overscroll-behavior-x: none;
            touch-action: manipulation;
        }
        .main-stage {
            /* 只允许纵向滚动；横向滑动交给 JS 判定，浏览器不做整页前进/后退 */
            touch-action: pan-y;
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: 240px;
            height: 240px;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
        .btn-group { gap: 15px; }
        .btn { padding: 12px 25px; transition: transform 0.2s, box-shadow 0.2s; }
        body.kidlock .back-bar,
        body.kidlock .bottom-home {
            display: none !important;
        }
        body.kidlock .main-stage {
            touch-action: none;
        }
    </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="FlipCard.toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>

    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来认识动物</p>
    </div>
    
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击小动物，听听它叫什么名字～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    
    <div class="main-stage">
        <div id="animalCards"></div>
        
        <div class="progress" id="progressDots"></div>
        
        <div class="bottom-home" style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
    
    <div class="stars" id="starEffect">⭐</div>

    <script src="js/common.js"></script>
    <script src="js/flip-card.js"></script>
    <script>
        let animals = [];
        let currentIndex = 0;
        let speechEnabled = true;
        let mascotTimer = null;

        function stopMascotTimer() {
            if (mascotTimer) {
                clearTimeout(mascotTimer);
                mascotTimer = null;
            }
        }

        async function loadAnimals() {
            try {
                const data = await XiaoDou.loadModule('animal');
                animals = XiaoDou.getItems(data);
                // 如果 JSON 没有 sound，根据常见动物补默认值
                const soundMap = {
                    'cat': '喵喵', 'dog': '汪汪', 'bird': '唧唧', 'fish': '咕噜',
                    'rabbit': '咕咕', 'bear': '吼', 'horse': '嘶', 'elephant': '喇叭',
                    'mouse': '吱吱', 'duck': '嘎嘎', 'pig': '哼哼', 'cow': '哞哞',
                    'sheep': '咩咩', 'chicken': '喔喔', 'lion': '吼吼', 'tiger': '嗷嗷',
                    'monkey': '唧唧', 'panda': '嗯嗯', 'giraffe': '呼呼', 'frog': '呱呱',
                    'dolphin': '吱吱', 'whale': '呜呜'
                };
                animals.forEach(a => {
                    if (!a.sound && soundMap[a.file]) a.sound = soundMap[a.file];
                });
                renderCards();
                FlipCard.setupSwipe(nextAnimal, prevAnimal);
                updateNavButtons();
            } catch (err) {
                console.error('加载动物数据失败:', err);
                FlipCard.showMascot('动物数据加载失败，请刷新页面试试～');
            }
        }

        function showMascot(text) { FlipCard.showMascot(text); }

        function updateNavButtons() {
            FlipCard.updateNavButtons({ current: currentIndex, total: animals.length });
        }

        function renderCards() {
            const container = document.getElementById('animalCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            animals.forEach((animal, index) => {
                const card = document.createElement('div');
                card.className = 'animal-card' + (index === 0 ? ' active' : '');
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="prevAnimal()" aria-label="上一个">◀</button>
                        <img class="animal-image"
                             src="${XiaoDou.resolvePath(`assets/images/animals/${animal.file}.png`)}"
                             alt="${XiaoDou.escapeHtml(animal.word)}"
                             onclick="playWord(${index})">
                        <button class="side-arrow right" onclick="nextAnimal()" aria-label="下一个">▶</button>
                    </div>
                    <div class="animal-word">${XiaoDou.escapeHtml(animal.word)}</div>
                    <div class="animal-pinyin">${XiaoDou.escapeHtml(animal.pinyin)}</div>
                    <div class="animal-japanese">${XiaoDou.escapeHtml(animal.japanese)}（${XiaoDou.escapeHtml(animal.japanese_reading)}）</div>
                    <div class="animal-english">${XiaoDou.escapeHtml(animal.english)}</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        ${animal.sound ? `<button class="btn btn-sound" onclick="playSound(${index})">🎵 叫声</button>` : ''}
                        <button class="btn btn-japanese" onclick="playJapanese(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${index})">🇺🇸 英语</button>
                        <button class="btn btn-encyclopedia" onclick="playEncyclopedia(${index})">📖 百科</button>
                    </div>
                    <div class="encyclopedia-card" id="encyclopedia-${index}" style="display:none;">
                        <div class="encyclopedia-title">📖 ${XiaoDou.escapeHtml(animal.word)} 小百科</div>
                        <div class="encyclopedia-item"><strong>简介：</strong>${XiaoDou.escapeHtml(animal.intro || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>住哪里：</strong>${XiaoDou.escapeHtml(animal.habitat || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>吃什么：</strong>${XiaoDou.escapeHtml(animal.food || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>小知识：</strong>${XiaoDou.escapeHtml(animal.fun_fact || '待补充')}</div>
                    </div>
                    <a href="animal_match_game.html" style="display:inline-block;margin-top:12px;color:#FF6B6B;text-decoration:none;font-size:15px;">🎮 玩听音找图游戏</a>
                `;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateNavButtons();
        }

        function playWord(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/${animal.file}_word.mp3`;
            FlipCard.speakWithFallback(`${animal.word}，${animal.pinyin}`, mp3Path);
            showMascot(`我们来看看：${animal.word}，${animal.pinyin}。`);
            FlipCard.showStars();
        }

        function playSentence(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/sentences/${animal.file}_sentence.mp3`;
            FlipCard.speakWithFallback(animal.sentence, mp3Path);
            showMascot(animal.sentence);
        }

        function playSound(index) {
            const animal = animals[index];
            if (animal.sound) {
                const mp3Path = `assets/audio/animals/${animal.file}_sound.mp3`;
                FlipCard.speakWithFallback(animal.sound, mp3Path, 'zh-CN', 1.0);
                showMascot(`${animal.word}的叫声：${animal.sound}！`);
            }
        }

        function playJapanese(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/japanese/${animal.file}_japanese.mp3`;
            FlipCard.speakWithFallback(animal.japanese_reading, mp3Path, 'ja-JP', 0.75);
            showMascot(`${animal.word} 的日语是：${animal.japanese}（${animal.japanese_reading}）`);
        }

        function playEnglish(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/english/${animal.file}_english.mp3`;
            FlipCard.speakWithFallback(animal.english, mp3Path, 'en-US', 0.85);
            showMascot(`${animal.word} 的英语是：${animal.english}`);
        }

        function playEncyclopedia(index) {
            const animal = animals[index];
            if (!animal.intro) {
                showMascot(`${animal.word} 的百科内容还在准备中，先听听别的吧～`);
                return;
            }
            const text = `${animal.intro}${animal.habitat}${animal.food}${animal.fun_fact}`;
            const mp3Path = `assets/audio/animals/encyclopedia/${animal.file}_encyclopedia.mp3`;
            FlipCard.speakWithFallback(text, mp3Path, 'zh-CN', 0.8);
            showMascot(`${animal.word}：${animal.intro}`);
            stopMascotTimer();
            mascotTimer = setTimeout(() => showMascot(`我们来看看：${animal.word}，${animal.pinyin}。`), 8000);

            const card = document.getElementById(`encyclopedia-${index}`);
            if (card) {
                card.style.display = card.style.display === 'none' ? 'block' : 'none';
            }
        }

        function switchAnimal(direction) {
            FlipCard.stopAllAudio();
            const cards = document.querySelectorAll('.animal-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (!cards.length) return;

            let newIndex;
            if (direction === 'next') {
                newIndex = (currentIndex + 1) % animals.length;
            } else {
                newIndex = (currentIndex - 1 + animals.length) % animals.length;
            }

            cards[currentIndex].classList.remove('active');
            cards[currentIndex].classList.remove('slide-left-in', 'slide-right-in');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            dots[currentIndex].classList.remove('active');

            currentIndex = newIndex;
            document.querySelectorAll('.encyclopedia-card').forEach(el => el.style.display = 'none');

            cards[currentIndex].classList.remove('slide-left-out', 'slide-right-out');
            cards[currentIndex].classList.add('active');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            dots[currentIndex].classList.add('active');

            updateNavButtons();

            const animal = animals[currentIndex];
            showMascot(`我们来学${animal.word}！`);
            setTimeout(() => playWord(currentIndex), 500);
        }

        function nextAnimal() { switchAnimal('next'); }
        function prevAnimal() { switchAnimal('prev'); }

        // 初始化
        FlipCard.kidLockKey = 'animal_kidlock';
        FlipCard.initKidLock();
        FlipCard.startApp('你好！我是小豆。今天我们来认识动物。点击小动物，听听它叫什么名字。');
        loadAnimals();
    </script>
</body>
</html>
