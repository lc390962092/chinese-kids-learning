<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 认识动物</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #FF6B6B;
            --bg-gradient: linear-gradient(135deg, #FFF8E7 0%, #FFF0F5 100%);
        }
        body {
            /* 禁止浏览器级左右滑返回/前进（iOS Safari / Chrome 手势导航） */
            overscroll-behavior-x: none;
            touch-action: manipulation;
        }
        .main-stage {
            /* 只允许纵向滚动；横向滑动交给 JS 判定，浏览器不做整页前进/后退 */
            touch-action: pan-y;
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: 240px;
            height: 240px;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
        .btn-group { gap: 15px; }
        .btn { padding: 12px 25px; transition: transform 0.2s, box-shadow 0.2s; }
        body.kidlock .back-bar,
        body.kidlock .bottom-home {
            display: none !important;
        }
        body.kidlock .main-stage {
            touch-action: none;
        }
    </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>

    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来认识动物</p>
    </div>
    
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击小动物，听听它叫什么名字～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    
    <div class="main-stage">
        <div id="animalCards"></div>
        
        <div class="progress" id="progressDots"></div>
        
        <div class="bottom-home" style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
    
    <div class="stars" id="starEffect">⭐</div>

    <script src="js/common.js"></script>
    <script>
        let animals = [];
        let currentIndex = 0;
        let speechEnabled = true;
        let mascotTimer = null;

        function stopMascotTimer() {
            if (mascotTimer) {
                clearTimeout(mascotTimer);
                mascotTimer = null;
            }
        }

        async function loadAnimals() {
            try {
                const data = await XiaoDou.loadModule('animal');
                animals = XiaoDou.getItems(data);
                // 如果 JSON 没有 sound，根据常见动物补默认值
                const soundMap = {
                    'cat': '喵喵', 'dog': '汪汪', 'bird': '唧唧', 'fish': '咕噜',
                    'rabbit': '咕咕', 'bear': '吼', 'horse': '嘶', 'elephant': '喇叭',
                    'mouse': '吱吱', 'duck': '嘎嘎', 'pig': '哼哼', 'cow': '哞哞',
                    'sheep': '咩咩', 'chicken': '喔喔', 'lion': '吼吼', 'tiger': '嗷嗷',
                    'monkey': '唧唧', 'panda': '嗯嗯', 'giraffe': '呼呼', 'frog': '呱呱',
                    'dolphin': '吱吱', 'whale': '呜呜'
                };
                animals.forEach(a => {
                    if (!a.sound && soundMap[a.file]) a.sound = soundMap[a.file];
                });
                renderCards();
                setupSwipe();
                updateNavButtons();
            } catch (err) {
                console.error('加载动物数据失败:', err);
                showMascot('动物数据加载失败，请刷新页面试试～');
            }
        }

        function showMascot(text) {
            document.getElementById('mascotText').textContent = text;
        }

        function showStars() {
            const star = document.getElementById('starEffect');
            star.style.display = 'block';
            setTimeout(() => { star.style.display = 'none'; }, 1000);
        }

        function updateNavButtons() {
            const prevBtns = document.querySelectorAll('.side-arrow.left');
            const nextBtns = document.querySelectorAll('.side-arrow.right');
            prevBtns.forEach(btn => btn.disabled = currentIndex === 0);
            nextBtns.forEach(btn => btn.disabled = currentIndex === animals.length - 1);
        }

        // 全局音频状态：避免多次点击叠加播放、切换页面不停止
        let currentAudio = null;

        function stopCurrentAudio() {
            // 停止本地 MP3 音频
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
                currentAudio.onerror = null;
                currentAudio = null;
            }
            // 停止所有 <audio> 元素
            document.querySelectorAll('audio').forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            // 停止 TTS
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        }

        function playAudio(path) {
            stopCurrentAudio();
            return new Promise((resolve, reject) => {
                const audio = new Audio(XiaoDou.resolvePath(path));
                currentAudio = audio;
                audio.onended = () => {
                    currentAudio = null;
                    resolve();
                };
                audio.onerror = (e) => {
                    currentAudio = null;
                    console.log('MP3 加载失败:', path, e);
                    reject(e);
                };
                audio.play().catch((err) => {
                    currentAudio = null;
                    reject(err);
                });
            });
        }

        function speakWithFallback(text, mp3Path, lang = 'zh-CN', rate = 0.8) {
            stopCurrentAudio();
            const langKey = lang.startsWith('ja') ? 'ja' : (lang.startsWith('en') ? 'en' : 'zh');
            if (mp3Path) {
                playAudio(mp3Path).catch(() => {
                    console.log('MP3 播放失败，fallback 到 Web Speech API');
                    XiaoDou.speak(text, langKey, rate);
                });
            } else {
                XiaoDou.speak(text, langKey, rate);
            }
        }

        function renderCards() {
            const container = document.getElementById('animalCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            animals.forEach((animal, index) => {
                const card = document.createElement('div');
                card.className = 'animal-card' + (index === 0 ? ' active' : '');
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="prevAnimal()" aria-label="上一个">◀</button>
                        <img class="animal-image"
                             src="${XiaoDou.resolvePath(`assets/images/animals/${animal.file}.png`)}"
                             alt="${XiaoDou.escapeHtml(animal.word)}"
                             onclick="playWord(${index})">
                        <button class="side-arrow right" onclick="nextAnimal()" aria-label="下一个">▶</button>
                    </div>
                    <div class="animal-word">${XiaoDou.escapeHtml(animal.word)}</div>
                    <div class="animal-pinyin">${XiaoDou.escapeHtml(animal.pinyin)}</div>
                    <div class="animal-japanese">${XiaoDou.escapeHtml(animal.japanese)}（${XiaoDou.escapeHtml(animal.japanese_reading)}）</div>
                    <div class="animal-english">${XiaoDou.escapeHtml(animal.english)}</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        ${animal.sound ? `<button class="btn btn-sound" onclick="playSound(${index})">🎵 叫声</button>` : ''}
                        <button class="btn btn-japanese" onclick="playJapanese(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${index})">🇺🇸 英语</button>
                        <button class="btn btn-encyclopedia" onclick="playEncyclopedia(${index})">📖 百科</button>
                    </div>
                    <div class="encyclopedia-card" id="encyclopedia-${index}" style="display:none;">
                        <div class="encyclopedia-title">📖 ${XiaoDou.escapeHtml(animal.word)} 小百科</div>
                        <div class="encyclopedia-item"><strong>简介：</strong>${XiaoDou.escapeHtml(animal.intro || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>住哪里：</strong>${XiaoDou.escapeHtml(animal.habitat || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>吃什么：</strong>${XiaoDou.escapeHtml(animal.food || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>小知识：</strong>${XiaoDou.escapeHtml(animal.fun_fact || '待补充')}</div>
                    </div>
                    <a href="animal_match_game.html" style="display:inline-block;margin-top:12px;color:#FF6B6B;text-decoration:none;font-size:15px;">🎮 玩听音找图游戏</a>
                `;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateNavButtons();
        }

        function playWord(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/${animal.file}_word.mp3`;
            speakWithFallback(`${animal.word}，${animal.pinyin}`, mp3Path);
            showMascot(`我们来看看：${animal.word}，${animal.pinyin}。`);
            showStars();
        }

        function playSentence(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/sentences/${animal.file}_sentence.mp3`;
            speakWithFallback(animal.sentence, mp3Path);
            showMascot(animal.sentence);
        }

        function playSound(index) {
            const animal = animals[index];
            if (animal.sound) {
                const mp3Path = `assets/audio/animals/${animal.file}_sound.mp3`;
                speakWithFallback(animal.sound, mp3Path, 'zh-CN', 1.0);
                showMascot(`${animal.word}的叫声：${animal.sound}！`);
            }
        }

        function playJapanese(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/japanese/${animal.file}_japanese.mp3`;
            speakWithFallback(animal.japanese_reading, mp3Path, 'ja-JP', 0.75);
            showMascot(`${animal.word} 的日语是：${animal.japanese}（${animal.japanese_reading}）`);
        }

        function playEnglish(index) {
            const animal = animals[index];
            const mp3Path = `assets/audio/animals/english/${animal.file}_english.mp3`;
            speakWithFallback(animal.english, mp3Path, 'en-US', 0.85);
            showMascot(`${animal.word} 的英语是：${animal.english}`);
        }

        function playEncyclopedia(index) {
            const animal = animals[index];
            if (!animal.intro) {
                showMascot(`${animal.word} 的百科内容还在准备中，先听听别的吧～`);
                return;
            }
            const text = `${animal.intro}${animal.habitat}${animal.food}${animal.fun_fact}`;
            const mp3Path = `assets/audio/animals/encyclopedia/${animal.file}_encyclopedia.mp3`;
            speakWithFallback(text, mp3Path, 'zh-CN', 0.8);
            showMascot(`${animal.word}：${animal.intro}`);
            stopMascotTimer();
            mascotTimer = setTimeout(() => showMascot(`我们来看看：${animal.word}，${animal.pinyin}。`), 8000);

            const card = document.getElementById(`encyclopedia-${index}`);
            if (card) {
                card.style.display = card.style.display === 'none' ? 'block' : 'none';
            }
        }

        function stopAllAudio() {
            stopCurrentAudio();
        }

        function switchAnimal(direction) {
            stopAllAudio();
            const cards = document.querySelectorAll('.animal-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (!cards.length) return;

            let newIndex;
            if (direction === 'next') {
                newIndex = (currentIndex + 1) % animals.length;
            } else {
                newIndex = (currentIndex - 1 + animals.length) % animals.length;
            }

            cards[currentIndex].classList.remove('active');
            cards[currentIndex].classList.remove('slide-left-in', 'slide-right-in');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            dots[currentIndex].classList.remove('active');

            currentIndex = newIndex;
            document.querySelectorAll('.encyclopedia-card').forEach(el => el.style.display = 'none');

            cards[currentIndex].classList.remove('slide-left-out', 'slide-right-out');
            cards[currentIndex].classList.add('active');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            dots[currentIndex].classList.add('active');

            updateNavButtons();

            const animal = animals[currentIndex];
            showMascot(`我们来学${animal.word}！`);
            setTimeout(() => playWord(currentIndex), 500);
        }

        function nextAnimal() { switchAnimal('next'); }
        function prevAnimal() { switchAnimal('prev'); }

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let touchTargetIsInteractive = false;

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'animal_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            // 锁定时收起所有百科卡片，避免内容超出屏幕又滑不回去
            if (kidLockOn) {
                document.querySelectorAll('.encyclopedia-card').forEach(el => el.style.display = 'none');
            }
            showMascot(kidLockOn
                ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                : '儿童锁关闭。');
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }

        function isInteractiveTarget(el) {
            if (!el || !el.closest) return false;
            // 图片不算交互目标：解锁状态下支持"滑照片"翻页
            return !!el.closest('button, a, input, .btn, .side-arrow, .kidlock-bar');
        }

        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;

            // 注意：不要在 touchstart 里 preventDefault！
            // 那会同时杀死 click 和垂直滚动。横向原生手势已由 CSS
            // touch-action: pan-y + body overscroll-behavior-x: none 禁用。

            mainStage.addEventListener('touchstart', function(e) {
                const t = e.changedTouches[0];
                touchStartX = t.screenX;
                touchStartY = t.screenY;
                // 图片允许作为滑动手势起点（解锁状态下"滑照片"翻页）
                touchTargetIsInteractive = isInteractiveTarget(e.target);
            }, { passive: true });

            mainStage.addEventListener('touchend', function(e) {
                const t = e.changedTouches[0];
                touchEndX = t.screenX;
                touchEndY = t.screenY;
                handleSwipe();
            }, { passive: true });

            let mouseDown = false;
            mainStage.addEventListener('mousedown', function(e) {
                mouseDown = true;
                touchStartX = e.screenX;
                touchStartY = e.screenY;
                touchTargetIsInteractive = isInteractiveTarget(e.target);
            });

            mainStage.addEventListener('mouseup', function(e) {
                if (!mouseDown) return;
                mouseDown = false;
                touchEndX = e.screenX;
                touchEndY = e.screenY;
                handleSwipe();
            });

            mainStage.addEventListener('mouseleave', function() {
                mouseDown = false;
            });
        }

        function handleSwipe() {
            // 儿童锁开启：手势翻页禁用，但按钮/图片点击仍正常
            // （touch 事件未 preventDefault，click 不会被吞）
            if (kidLockOn) return;

            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            const absX = Math.abs(diffX);
            const absY = Math.abs(diffY);
            const swipeThreshold = 60; // 比原来小：轻轻滑也能翻页

            // 1. 必须横向明显大于纵向（角度过滤，垂直滑动页面不翻页）
            if (absY > absX) return;
            // 2. 水平距离达标
            if (absX < swipeThreshold) return;
            // 3. 起点不在按钮/链接/输入框上（图片可以，支持"滑照片"翻页）
            if (touchTargetIsInteractive) return;

            if (diffX > 0) nextAnimal();
            else prevAnimal();
        }

        let appStarted = false;

        function startApp() {
            if (appStarted) return;
            appStarted = true;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
            }

            const silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
            silentAudio.play().catch(() => {});

            showMascot("你好！我是小豆。今天我们来认识动物。点击小动物，听听它叫什么名字。");

            setTimeout(() => {
                XiaoDou.speak("你好！我是小豆。今天我们来认识动物。点击小动物，听听它叫什么名字。", 'zh');
            }, 300);
        }

        loadAnimals();
        initKidLock();
        startApp();
    </script>
</body>
</html>
