<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 交通工具</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #5C6BC0;
            --bg-gradient: linear-gradient(135deg, #E3F2FD 0%, #FFF0F5 100%);
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="FlipCard.toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>

    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来认识交通工具</p>
    </div>
    
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击交通工具，听听它叫什么名字～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    
    <div class="main-stage">
        <div id="vehicleCards"></div>
        <div class="progress" id="progressDots"></div>
        <div class="hint">提示：如果听不到声音，请检查浏览器是否允许播放音频</div>
        
        <a href="index.html" class="back-home">⬅️ 返回首页</a>
    </div>

    <script src="js/common.js"></script>
    <script src="js/flip-card.js"></script>
    <script>
        let vehicles = [];
        let filteredVehicles = [];
        let currentIndex = 0;
        let currentFilter = 'all';

        async function init() {
            try {
                const data = await XiaoDou.loadModule('vehicle');
                vehicles = XiaoDou.getItems(data).map(item => {
                    item.sentence = item.sentence || item.summary || '';
                    item.file = item.file || item.english || '';
                    return item;
                });
                filteredVehicles = [...vehicles];
                renderCards();
                FlipCard.showMascot('滴滴！叭叭！欢迎来到小豆交通工具乐园～');
            } catch (err) {
                console.error('加载数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">交通工具数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { FlipCard.showMascot(text); }

        function filterVehicles(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === type);
            });
            if (type === 'all') filteredVehicles = [...vehicles];
            else filteredVehicles = vehicles.filter(item => (item.tags || []).includes(type));
            currentIndex = 0;
            renderCards();
            const messages = {
                all: '所有交通工具都在这里！', land: '看看路上跑的车车～', rail: '轨道上的火车和电车！', air: '天上飞的飞机！', water: '水里开的小船！', emergency: '帮助大家的好车！'
            };
            showMascot(messages[type]);
        }

        function renderCards() {
            const container = document.getElementById('vehicleCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            filteredVehicles.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'vehicle-card' + (index === 0 ? ' active' : '');
                const emoji = (item.tags || []).includes('land') ? '🚗' : (item.tags || []).includes('rail') ? '🚃' : (item.tags || []).includes('air') ? '✈️' : (item.tags || []).includes('water') ? '🚢' : '🚑';
                const svgFallback = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Crect fill='%23f0f0f0' width='240' height='240'/%3E%3Ctext x='120' y='150' font-size='90' text-anchor='middle'%3E" + emoji + "%3C/text%3E%3C/svg%3E";
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="event.stopPropagation(); prevVehicle();">◀</button>
                        <img loading="lazy" class="vehicle-image" onclick="playVehicle(${index})"
                             src="${XiaoDou.resolvePath(`assets/images/vehicles/${item.file}.webp`)}" alt="${XiaoDou.escapeHtml(item.word)}" onerror="this.src='${svgFallback}'">
                        <button class="side-arrow right" onclick="event.stopPropagation(); nextVehicle();">▶</button>
                    </div>
                    <div class="vehicle-word">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="vehicle-pinyin">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="vehicle-english">${XiaoDou.escapeHtml(item.english)}</div>
                    <div class="vehicle-sentence">${XiaoDou.escapeHtml(item.sentence)}</div>
                    <div class="vehicle-japanese">${XiaoDou.escapeHtml(item.word)} → ${XiaoDou.escapeHtml(item.japanese)}（${XiaoDou.escapeHtml(item.japanese_reading)}）</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playVehicle(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        <button class="btn btn-sound" onclick="playSound(${index})">🔔 声音</button>
                        <button class="btn btn-japanese" onclick="playJapanese(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${index})">🇺🇸 英语</button>
                        <button class="btn btn-encyclopedia" onclick="playEncyclopedia(${index})">📖 百科</button>
                    </div>
                    <div class="encyclopedia-card" id="encyclopedia-${index}" style="display:none;">
                        <div class="encyclopedia-title">📖 ${XiaoDou.escapeHtml(item.word)} 小百科</div>
                        <div class="encyclopedia-item"><strong>简介：</strong>${XiaoDou.escapeHtml(item.intro || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>在哪里：</strong>${XiaoDou.escapeHtml(item.where || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>有什么用：</strong>${XiaoDou.escapeHtml(item.use || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>小知识：</strong>${XiaoDou.escapeHtml(item.fun_fact || '待补充')}</div>
                    </div>`;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateButtonState();
        }

        function updateButtonState() {
            FlipCard.updateNavButtons({ current: currentIndex, total: filteredVehicles.length });
        }

        function playVehicle(index) {
            FlipCard.stopAllAudio();
            const item = filteredVehicles[index];
            XiaoDou.playAudio(`assets/audio/vehicles/${item.file}_word.mp3`, item.word, 'zh');
            showMascot(`这是${item.word}，${item.pinyin}。`);
        }

        function playSentence(index) {
            FlipCard.stopAllAudio();
            const item = filteredVehicles[index];
            XiaoDou.playAudio(`assets/audio/vehicles/sentences/${item.file}_sentence.mp3`, item.sentence, 'zh');
            showMascot(item.sentence);
        }

        function playSound(index) {
            FlipCard.stopAllAudio();
            const item = filteredVehicles[index];
            if (item.sound) {
                XiaoDou.playAudio(`assets/audio/vehicles/sounds/${item.sound}.mp3`, item.sound_text || item.word, 'zh');
                showMascot(`${item.word} 的声音：${item.sound_text || item.sound}！`);
            } else {
                XiaoDou.speak(item.word, 'zh');
                showMascot(`${item.word} 没有专属声音，小豆来读～`);
            }
        }

        function playJapanese(index) {
            FlipCard.stopAllAudio();
            const item = filteredVehicles[index];
            XiaoDou.playAudio(`assets/audio/vehicles/japanese/${item.file}_japanese.mp3`, item.japanese_reading, 'ja');
            showMascot(`日语：${item.word} → ${item.japanese}（${item.japanese_reading}）`);
        }

        function playEnglish(index) {
            FlipCard.stopAllAudio();
            const item = filteredVehicles[index];
            XiaoDou.playAudio(`assets/audio/vehicles/english/${item.file}_english.mp3`, item.english, 'en');
            showMascot(`英语：${item.word} → ${item.english}`);
        }

        function switchVehicle(direction) {
            FlipCard.stopAllAudio();
            const cards = document.querySelectorAll('.vehicle-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (cards.length === 0) return;
            let newIndex;
            if (direction === 'next') newIndex = (currentIndex + 1) % filteredVehicles.length;
            else newIndex = (currentIndex - 1 + filteredVehicles.length) % filteredVehicles.length;
            cards[currentIndex].classList.remove('active');
            dots[currentIndex].classList.remove('active');
            currentIndex = newIndex;
            cards[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
            updateButtonState();
            const item = filteredVehicles[currentIndex];
            showMascot(`下一辆：${item.word}！`);
            setTimeout(() => playVehicle(currentIndex), 500);
        }

        function nextVehicle() { switchVehicle('next'); }
        function prevVehicle() { switchVehicle('prev'); }

        function playEncyclopedia(index) {
            FlipCard.stopAllAudio();
            const item = filteredVehicles[index];
            if (!item.intro) {
                showMascot(`${item.word} 的百科内容还在准备中，先听听别的吧～`);
                return;
            }
            const text = `${item.word}。${item.intro}${item.where}${item.use}${item.fun_fact}`;
            XiaoDou.speak(text, 'zh', 0.8);
            showMascot(`${item.word}的小百科：${item.intro}`);

            const card = document.getElementById(`encyclopedia-${index}`);
            if (card) {
                document.querySelectorAll('.encyclopedia-card').forEach(el => {
                    if (el.id !== `encyclopedia-${index}`) el.style.display = 'none';
                });
                card.style.display = card.style.display === 'none' ? 'block' : 'none';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextVehicle();
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevVehicle();
        });

        // 初始化
        FlipCard.kidLockKey = 'vehicle_kidlock';
        FlipCard.initKidLock();
        FlipCard.setupSwipe(nextVehicle, prevVehicle);
        init();
    </script>
</body>
</html>
