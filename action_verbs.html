<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 动词与动作</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #43A047;
            --bg-gradient: linear-gradient(135deg, #E8F5E9 0%, #FFF3E0 100%);
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: fit-content;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🏃 小豆中文</h1>
        <p>今天我们来学动词与动作</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">站起来！跑一跑！跟着小豆动起来～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="game-banner" onclick="window.location.href='action_game.html'">
        <a href="action_game.html">🎮 玩"我说你做"游戏</a>
        <p>听指令做动作，亲子互动更有趣</p>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="filterItems('all')">全部</button>
        <button class="filter-btn" data-filter="body" onclick="filterItems('body')">🦵 身体动作</button>
        <button class="filter-btn" data-filter="hand" onclick="filterItems('hand')">🖐️ 手部动作</button>
        <button class="filter-btn" data-filter="face" onclick="filterItems('face')">😊 看听说笑</button>
        <button class="filter-btn" data-filter="play" onclick="filterItems('play')">🎈 游戏动作</button>
    </div>
    <div class="main-stage">
        <div id="itemCards"></div>
        <div class="nav-btns">
            <button class="nav-btn" id="prevBtn" onclick="prevItem()">⬅️ 上一个</button>
            <button class="nav-btn" id="nextBtn" onclick="nextItem()">下一个 ➡️</button>
        </div>
        <div class="progress" id="progressDots"></div>
        <div style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
<script src="js/common.js"></script>
    <script>
        let allItems = [];
        let filteredItems = [];
        let currentIndex = 0;
        let currentFilter = 'all';

        async function init() {
            try {
                const data = await XiaoDou.loadModule('action_verbs');
                allItems = XiaoDou.getItems(data).map(item => {
                    item.sentence = item.sentence || item.summary || '';
                    return item;
                });
                filteredItems = [...allItems];
                renderCards();
                setupSwipe();
            } catch (err) {
                console.error('加载数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">动词数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function filterItems(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === tag);
            });
            if (tag === 'all') filteredItems = [...allItems];
            else filteredItems = allItems.filter(item => (item.tags || []).includes(tag));
            currentIndex = 0;
            renderCards();
            const messages = {
                all: '全部动作都在这里啦！点击句子跟着做～',
                body: '动动身体：站、坐、走、跑、跳！',
                hand: '小手也能做很多事：拿、放、推、拉！',
                face: '用眼睛看、用耳朵听、用嘴巴说～',
                play: '这些动作玩游戏时常用！'
            };
            showMascot(messages[tag]);
        }

        function renderCards() {
            const container = document.getElementById('itemCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            filteredItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card' + (index === 0 ? ' active' : '');
                const emoji = (item.tags || []).includes('body') ? '🦵' : (item.tags || []).includes('hand') ? '🖐️' : (item.tags || []).includes('face') ? '😊' : '🎈';
                const svgFallback = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Crect fill='%23f0f0f0' width='240' height='240'/%3E%3Ctext x='120' y='150' font-size='90' text-anchor='middle'%3E" + emoji + "%3C/text%3E%3C/svg%3E";
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" id="prevArrow" onclick="prevItem()">◀</button>
                        <img class="item-image" src="${XiaoDou.resolvePath(`assets/images/action_verbs/${item.file}.png`)}" alt="${XiaoDou.escapeHtml(item.word)}" onerror="this.src='${svgFallback}'" onclick="playWord(${index})">
                        <button class="side-arrow right" id="nextArrow" onclick="nextItem()">▶</button>
                    </div>
                    <div class="item-word">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="item-pinyin">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="item-english">${XiaoDou.escapeHtml(item.english)}</div>
                    <div class="item-sentence">${XiaoDou.escapeHtml(item.sentence)}</div>
                    <div class="item-japanese">${XiaoDou.escapeHtml(item.word)} → ${XiaoDou.escapeHtml(item.japanese)}（${XiaoDou.escapeHtml(item.japanese_reading)}）</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        <button class="btn btn-japanese" onclick="playJapaneseWord(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglishWord(${index})">🇺🇸 英语</button>
                    </div>`;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateArrowState();
        }

        function updateArrowState() {
            const prevArrow = document.getElementById('prevArrow');
            const nextArrow = document.getElementById('nextArrow');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            if (prevArrow) prevArrow.disabled = currentIndex === 0;
            if (nextArrow) nextArrow.disabled = currentIndex === filteredItems.length - 1;
            if (prevBtn) prevBtn.disabled = currentIndex === 0;
            if (nextBtn) nextBtn.disabled = currentIndex === filteredItems.length - 1;
        }

        function playWord(index) {
            const item = filteredItems[index];
            XiaoDou.playAudio(`assets/audio/action_verbs/${item.file}_word.mp3`, item.word, 'zh');
            showMascot(`我们来看看：${item.word}，${item.pinyin}。`);
        }

        function playSentence(index) {
            const item = filteredItems[index];
            XiaoDou.playAudio(`assets/audio/action_verbs/sentences/${item.file}_sentence.mp3`, item.sentence, 'zh');
            showMascot(item.sentence);
        }

        function playJapaneseWord(index) {
            const item = filteredItems[index];
            XiaoDou.playAudio(`assets/audio/action_verbs/japanese/${item.file}_japanese.mp3`, item.japanese_reading, 'ja');
            showMascot(`日语：${item.word} → ${item.japanese}（${item.japanese_reading}）`);
        }

        function playEnglishWord(index) {
            const item = filteredItems[index];
            XiaoDou.playAudio(`assets/audio/action_verbs/english/${item.file}_english.mp3`, item.english, 'en');
            showMascot(`英语：${item.word} → ${item.english}`);
        }

        function switchItem(direction) {
            const cards = document.querySelectorAll('.item-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (cards.length === 0) return;
            let newIndex;
            if (direction === 'next') newIndex = (currentIndex + 1) % filteredItems.length;
            else newIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
            cards[currentIndex].classList.remove('active');
            cards[currentIndex].classList.remove('slide-left-in', 'slide-right-in');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            dots[currentIndex].classList.remove('active');
            currentIndex = newIndex;
            cards[currentIndex].classList.remove('slide-left-out', 'slide-right-out');
            cards[currentIndex].classList.add('active');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            dots[currentIndex].classList.add('active');
            updateArrowState();
            const item = filteredItems[currentIndex];
            showMascot(`我们来学${item.word}！`);
            setTimeout(() => playWord(currentIndex), 500);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }

        let touchStartX = 0, touchEndX = 0;
        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;
            mainStage.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            mainStage.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }
        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const swipeThreshold = 50;
            if (touchStartX - touchEndX > swipeThreshold) nextItem();
            else if (touchEndX - touchStartX > swipeThreshold) prevItem();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextItem();
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevItem();
        });

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'action_verbs_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
    </script></body>
</html>
