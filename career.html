<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 职业梦想</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #FFF3E0 0%, #FFF0F5 100%); min-height: 100vh; overflow-x: hidden; }
        .header { text-align: center; padding: 20px 10px 10px; }
        .header h1 { color: #FB8C00; font-size: 28px; margin-bottom: 5px; }
        .header p { color: #888; font-size: 14px; }
        .mascot { text-align: center; padding: 10px; }
        .mascot-bubble { display: inline-block; background: white; border-radius: 25px; padding: 12px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #555; font-size: 16px; max-width: 80%; position: relative; margin-bottom: 15px; }
        .mascot-bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .mascot-avatar { width: 60px; height: 60px; background: #FFD93D; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .main-stage { background: white; border-radius: 30px 30px 0 0; min-height: 60vh; padding: 25px 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); touch-action: pan-y; }
        .card { display: none; text-align: center; animation: fadeIn 0.5s ease; }
        .card.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-emoji { width: 200px; height: 200px; font-size: 130px; line-height: 200px; margin: 10px auto; background: #f8f8f8; border-radius: 30px; cursor: pointer; transition: transform 0.2s; user-select: none; }
        .card-emoji:active { transform: scale(0.95); }
        .card-title { font-size: 40px; color: #333; margin: 10px 0 5px; font-weight: bold; }
        .card-subtitle { font-size: 22px; color: #888; margin-bottom: 15px; }
        .card-text { background: #f8f8f8; border-radius: 20px; padding: 18px 20px; margin: 15px auto; max-width: 90%; text-align: left; font-size: 18px; line-height: 1.7; color: #444; }
        .keywords { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0; padding: 0 10px; }
        .keyword { background: #f0f0f0; color: #555; padding: 8px 16px; border-radius: 20px; font-size: 16px; cursor: pointer; }
        .keyword:active { background: #ddd; }
        .btn-group { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .btn { border: none; border-radius: 25px; padding: 12px 25px; font-size: 16px; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #FB8C00; }
        .btn-secondary { background: #4ECDC4; }
        .hint { color: #999; font-size: 13px; margin-top: 15px; text-align: center; }
        .swipe-hint { color: #bbb; font-size: 12px; margin-top: 8px; text-align: center; }
        .nav-btns { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .nav-btn { background: #95E1D3; color: #333; border: none; border-radius: 25px; padding: 12px 30px; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
        .progress-dot.active { background: #FB8C00; }
        .start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #FFF3E0 0%, #FFF0F5 100%); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .start-content { background: white; padding: 40px 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 320px; width: 90%; }
        .start-panda { font-size: 80px; margin-bottom: 10px; }
        .start-content h2 { color: #FB8C00; font-size: 32px; margin-bottom: 10px; }
        .start-content p { color: #888; font-size: 16px; margin-bottom: 25px; }
        .start-btn { background: #FB8C00; color: white; border: none; border-radius: 30px; padding: 15px 50px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .start-btn:active { transform: scale(0.95); }
        .back-home { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px; }
        .back-bar { display: block; padding: 12px 15px; color: #666; text-decoration: none; font-size: 15px; background: rgba(255,255,255,0.5); backdrop-filter: blur(5px); }
       .card-japanese { font-size: 28px; color: #E91E63; margin: 5px 0; font-weight: bold; }
       .card-japanese-reading { font-size: 16px; color: #888; margin-bottom: 10px; }
       .btn-japanese { background: #E91E63; }
        .card-english { font-size: 28px; color: #1565C0; margin: 5px 0; font-weight: bold; }
        .card-english-reading { font-size: 16px; color: #888; margin-bottom: 10px; }
        .btn-english { background: #1565C0; }
        .career-english { font-size: 28px; color: #1565C0; margin: 5px 0; font-weight: bold; }
        @media (max-width: 400px) { .card-emoji { width: 170px; height: 170px; line-height: 170px; font-size: 100px; } .card-title { font-size: 34px; } }
    </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>
    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <div class="start-panda">🐼</div>
            <h2>小豆职业梦想</h2>
            <p>一起认识各种职业</p>
            <button class="start-btn" onclick="startApp()">开始学习</button>
        </div>
    </div>
    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来学习职业梦想</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击卡片，听听怎么读～左右滑动可以切换</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="main-stage" id="mainStage">
        <div id="cards">
        </div>
        <div class="progress" id="progressDots">
        </div>
        <div class="hint">提示：如果听不到声音，请检查浏览器是否允许播放音频</div>
        <div class="swipe-hint">← 左右滑动切换卡片 →</div>
        <a href="index.html" class="back-home">⬅️ 返回首页</a>
    </div>
<script src="js/common.js"></script>
    <script>
        let items = [];
        let currentIndex = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        const SWIPE_THRESHOLD = 50;
        const TAP_THRESHOLD = 10;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('dream_jobs');
                items = XiaoDou.getItems(data).map(item => {
                    item.summary = item.summary || item.sentence || '';
                    return item;
                });
                renderCards();
            } catch (err) {
                console.error('加载数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">职业梦想数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function renderCards() {
            const cardsContainer = document.getElementById('cards');
            const dotsContainer = document.getElementById('progressDots');
            cardsContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            items.forEach((item, index) => {
                const keywordsHtml = item.words.map(w => `<span class="keyword" onclick="XiaoDou.speak('${XiaoDou.escapeHtml(w)}', 'zh')">${XiaoDou.escapeHtml(w)}</span>`).join('');
                const card = document.createElement('div');
                card.className = 'card' + (index === 0 ? ' active' : '');
                card.innerHTML = `
                    <div class="card-emoji" onclick="playWord(${index})">${XiaoDou.escapeHtml(item.emoji)}</div>
                    <div class="card-title">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="card-subtitle">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="card-japanese">${XiaoDou.escapeHtml(item.japanese)}</div>
                    <div class="card-japanese-reading">${XiaoDou.escapeHtml(item.japanese_reading)}</div>
                    <div class="card-english">${XiaoDou.escapeHtml(item.english)}</div>
                    <div class="card-text">${XiaoDou.escapeHtml(item.summary)}</div>
                    <div class="keywords">${keywordsHtml}</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="playWord(${index})">🔊 读词语</button>
                        <button class="btn btn-secondary" onclick="playSentence(${index})">📝 读句子</button>
                        <button class="btn btn-japanese" onclick="playJapanese(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${index})">🇺🇸 英语</button>
                    </div>
                    <div class="nav-btns">
                        <button class="nav-btn" onclick="prevItem()">⬅️ 上一个</button>
                        <button class="nav-btn" onclick="nextItem()">下一个 ➡️</button>
                    </div>
                `;
                cardsContainer.appendChild(card);
                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                dotsContainer.appendChild(dot);
            });
        }

        function playJapanese(index) {
            const item = items[index];
            XiaoDou.playAudio(`assets/audio/career/japanese/${item.file}_japanese.mp3`, `${item.japanese}、${item.japanese_reading}`, 'ja');
            showMascot(`日语：${item.word} → ${item.japanese}（${item.japanese_reading}）`);
        }

        function playEnglish(index) {
            const item = items[index];
            XiaoDou.playAudio(`assets/audio/career/english/${item.file}_english.mp3`, item.english, 'en');
            showMascot(item.english + ' 🇺🇸 English');
        }

        function playWord(index) {
            const item = items[index];
            XiaoDou.playAudio(`assets/audio/career/${item.file}_word.mp3`, item.word, 'zh');
            showMascot('这是' + item.word + '，' + item.pinyin + '。');
        }

        function playSentence(index) {
            const item = items[index];
            XiaoDou.playAudio(`assets/audio/career/sentences/${item.file}_sentence.mp3`, item.summary, 'zh');
            showMascot(item.summary);
        }

        function switchCard(direction) {
            const cards = document.querySelectorAll('.card');
            const dots = document.querySelectorAll('.progress-dot');
            cards[currentIndex].classList.remove('active');
            dots[currentIndex].classList.remove('active');
            if (direction === 'next') currentIndex = (currentIndex + 1) % items.length;
            else currentIndex = (currentIndex - 1 + items.length) % items.length;
            cards[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
            const item = items[currentIndex];
            playWord(currentIndex);
            showMascot('这是' + item.word + '，' + item.pinyin + '。');
        }

        function nextItem() { switchCard('next'); }
        function prevItem() { switchCard('prev'); }

        function startApp() {
            document.getElementById('startOverlay').style.display = 'none';
            renderCards();
            XiaoDou.speak('你好！我是小豆。今天我们来学习职业梦想。', 'zh');
            showMascot('你好！我是小豆。今天我们来学习职业梦想。');
        }

        const mainStage = document.getElementById('mainStage');
        mainStage.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });
        mainStage.addEventListener('touchmove', function() {}, { passive: true });
        mainStage.addEventListener('touchend', function(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            const timeDiff = Date.now() - touchStartTime;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD && timeDiff < 500) {
                if (diffX > 0) nextItem(); else prevItem();
            }
        }, { passive: true });

        init();
    </script></body>
</html>
