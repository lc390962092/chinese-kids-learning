<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 拼音王国</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #5C6BC0;
            --bg-gradient: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%);
        }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="FlipCard.toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆拼音</h1>
        <p>声母 · 韵母 · 声调</p>
    </div>
    
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！我是小豆，今天我们一起学拼音～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    
    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-section="initials">声母</button>
        <button class="tab-btn" data-section="finals">韵母</button>
        <button class="tab-btn" data-section="tones">声调</button>
    </div>
    
    <div class="main-stage">
        <div class="card-wrapper">
            <button class="side-arrow left" id="prevBtn" onclick="prevItem()" aria-label="上一个">◀</button>
            <div id="cardContainer"></div>
            <button class="side-arrow right" id="nextBtn" onclick="nextItem()" aria-label="下一个">▶</button>
        </div>
        
        <a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        
        <div class="progress" id="progressDots"></div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/flip-card.js"></script>
    <script>
        let pinyinData = { initials: [], finals: [], tones: [] };
        let currentSection = 'initials';
        let currentIndex = 0;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('pinyin');
                // 保持原数据结构
                for (const sec of (data.sections || [])) {
                    if (pinyinData[sec.id]) pinyinData[sec.id] = sec.items || [];
                }
                // 原 inline 有 18 个 finals，JSON 只有 18 个，一致
                renderTabs();
                renderCard();
                updateNavButtons();
                FlipCard.setupSwipe(nextItem, prevItem);
            } catch (err) {
                console.error('加载拼音数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">拼音数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { FlipCard.showMascot(text); }

        function getAudioPath(section, index, tone) {
            if (section === 'tones') {
                return XiaoDou.resolvePath(`assets/audio/pinyin/tones/${String(index).padStart(2, '0')}_tone${tone}.mp3`);
            }
            const item = pinyinData[section][index];
            return XiaoDou.resolvePath(`assets/audio/pinyin/${section}/${String(index).padStart(2, '0')}_${item.pinyin}.mp3`);
        }

        function playPinyinAudio(path, fallbackText) {
            XiaoDou.playAudio(path, fallbackText, 'zh');
        }

        function renderTabs() {
            const tabNames = { initials: '声母', finals: '韵母', tones: '声调' };
            const tabs = document.getElementById('tabs');
            tabs.innerHTML = '';
            for (const key of ['initials', 'finals', 'tones']) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (key === currentSection ? ' active' : '');
                btn.textContent = tabNames[key];
                btn.onclick = () => switchSection(key);
                tabs.appendChild(btn);
            }
        }

        function renderCard() {
            const container = document.getElementById('cardContainer');
            const section = pinyinData[currentSection];
            if (!section || section.length === 0) return;
            const item = section[currentIndex];
            let html = '';
            if (currentSection === 'tones') {
                html = `
                    <div class="tone-icon tone-${item.tone}">${item.examples[0].pinyin}</div>
                    <div class="tone-info">${item.name}：${item.description}</div>
                    <div class="tone-examples">
                        ${item.examples.map((ex, i) => `
                            <div class="tone-example-item" onclick="playToneExample(${item.tone}, ${i})">
                                <div class="word">${XiaoDou.escapeHtml(ex.word)}</div>
                                <div class="py">${XiaoDou.escapeHtml(ex.pinyin)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-play" onclick="playCurrent()">🔊 朗读声调</button>
                `;
            } else {
                html = `
                    <div class="big-pinyin" onclick="playCurrent()">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="example-word">${XiaoDou.escapeHtml(item.example_word)}</div>
                    <div class="example-pinyin">${XiaoDou.escapeHtml(item.example_pinyin)}</div>
                    <button class="btn-play" onclick="playCurrent()">🔊 朗读</button>
                `;
            }
            container.innerHTML = html;
            renderProgress();
            updateNavButtons();
        }

        function renderProgress() {
            const progress = document.getElementById('progressDots');
            const count = pinyinData[currentSection].length;
            progress.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (i === currentIndex ? ' active' : '');
                progress.appendChild(dot);
            }
        }

        function updateNavButtons() {
            const section = pinyinData[currentSection];
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === section.length - 1;
        }

        function playCurrent() {
            const item = pinyinData[currentSection][currentIndex];
            let text = '';
            let mp3Path = '';
            if (currentSection === 'tones') {
                text = `${item.name}，${item.examples[0].pinyin}，${item.examples[0].word}`;
                mp3Path = getAudioPath(currentSection, currentIndex, item.tone);
                showMascot(`${item.name}，${item.description}。比如 ${item.examples[0].word}，${item.examples[0].pinyin}。`);
            } else {
                text = `${item.pinyin}，${item.example_word}`;
                mp3Path = getAudioPath(currentSection, currentIndex);
                showMascot(`${item.pinyin}，${item.example_word}，${item.example_pinyin}。`);
            }
            playPinyinAudio(mp3Path, text);
        }

        function playToneExample(tone, exampleIndex) {
            const item = pinyinData.tones.find(t => t.tone === tone);
            const ex = item.examples[exampleIndex];
            XiaoDou.speak(ex.word, 'zh');
            showMascot(`${ex.word}，${ex.pinyin}。`);
        }

        function switchSection(section) {
            currentSection = section;
            currentIndex = 0;
            renderTabs();
            renderCard();
            updateNavButtons();
            showMascot(section === 'initials' ? '我们来学声母！' : section === 'finals' ? '我们来学韵母！' : '我们来学声调！');
        }

        function switchItem(direction) {
            const section = pinyinData[currentSection];
            const oldCard = document.getElementById('cardContainer').firstElementChild;
            let newIndex = currentIndex;
            if (direction === 'next' && currentIndex < section.length - 1) newIndex = currentIndex + 1;
            else if (direction === 'prev' && currentIndex > 0) newIndex = currentIndex - 1;
            if (newIndex === currentIndex) return;
            if (oldCard) {
                oldCard.classList.remove('slide-left-in', 'slide-right-in');
                oldCard.classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            }
            currentIndex = newIndex;
            renderCard();
            const newCard = document.getElementById('cardContainer').firstElementChild;
            if (newCard) {
                newCard.classList.remove('slide-left-out', 'slide-right-out');
                newCard.classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            }
            updateNavButtons();
            setTimeout(playCurrent, 300);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }





        init();


        // 初始化
        FlipCard.kidLockKey = 'pinyin_kidlock';
        FlipCard.initKidLock();
        FlipCard.startApp('你好！我是小豆。我们先从声母开始学拼音吧！');
        init();
    </script></body>
</html>
