<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 英语字母</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #43A047;
            --bg-gradient: linear-gradient(135deg, #E8F5E9 0%, #E3F2FD 100%);
        }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆英语字母</h1>
        <p>元音 · 辅音</p>
    </div>

    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！我是小豆，今天我们一起学英语字母～</div>
        <div class="mascot-avatar">🐼</div>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-section="vowels">元音</button>
        <button class="tab-btn" data-section="consonants">辅音</button>
    </div>

    <div class="main-stage">
        <div class="card-wrapper">
            <button class="side-arrow left" id="prevBtn" onclick="prevItem()" aria-label="上一个">◀</button>
            <div id="cardContainer"></div>
            <button class="side-arrow right" id="nextBtn" onclick="nextItem()" aria-label="下一个">▶</button>
        </div>

        <a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#888;text-decoration:none;font-size:14px;">← 回首页</a>

        <div class="progress" id="progressDots"></div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let alphabetData = { vowels: [], consonants: [] };
        let currentSection = 'vowels';
        let currentIndex = 0;
        let appStarted = false;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('alphabet');
                for (const sec of (data.sections || [])) {
                    if (alphabetData[sec.id]) alphabetData[sec.id] = sec.items || [];
                }
                renderTabs();
                renderCard();
                updateNavButtons();
                setupSwipe();
            } catch (err) {
                console.error('加载字母数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">字母数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function getAudioPath(section, index) {
            const item = alphabetData[section][index];
            const key = item.letter;
            return XiaoDou.resolvePath(`assets/audio/alphabet/${section}/${String(index).padStart(2, '0')}_${key}.mp3`);
        }

        function playAlphabetAudio(path, fallbackText) {
            XiaoDou.playAudio(path, fallbackText, 'en');
        }

        function renderTabs() {
            const tabNames = { vowels: '元音', consonants: '辅音' };
            const tabs = document.getElementById('tabs');
            tabs.innerHTML = '';
            for (const key of ['vowels', 'consonants']) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (key === currentSection ? ' active' : '');
                btn.textContent = tabNames[key];
                btn.onclick = () => switchSection(key);
                tabs.appendChild(btn);
            }
        }

        function renderCard() {
            const container = document.getElementById('cardContainer');
            const section = alphabetData[currentSection];
            if (!section || section.length === 0) return;
            const item = section[currentIndex];
            container.innerHTML = `
                <div class="big-letter" onclick="playCurrent()">${XiaoDou.escapeHtml(item.letter)}</div>
                <div class="lowercase-letter" onclick="playCurrent()">${XiaoDou.escapeHtml(item.lowercase)}</div>
                <div class="letter-sound">${XiaoDou.escapeHtml(item.sound)}</div>
                <div class="example-word">${XiaoDou.escapeHtml(item.example_word)}</div>
                <div class="example-meaning">${XiaoDou.escapeHtml(item.example_meaning)}</div>
                <button class="btn-play" onclick="playCurrent()">🔊 朗读</button>
            `;
            renderProgress();
            updateNavButtons();
        }

        function renderProgress() {
            const progress = document.getElementById('progressDots');
            const count = alphabetData[currentSection].length;
            progress.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (i === currentIndex ? ' active' : '');
                progress.appendChild(dot);
            }
        }

        function updateNavButtons() {
            // 启用循环滑动，箭头始终可用
            document.getElementById('prevBtn').disabled = false;
            document.getElementById('nextBtn').disabled = false;
        }

        function playCurrent() {
            const item = alphabetData[currentSection][currentIndex];
            const text = `${item.letter}. ${item.lowercase}. ${item.example_word}`;
            const mp3Path = getAudioPath(currentSection, currentIndex);
            showMascot(`${item.letter}${item.lowercase}，大写 ${item.letter}，小写 ${item.lowercase}，发音 ${item.sound}。例词：${item.example_word}，意思是 ${item.example_meaning}。`);
            playAlphabetAudio(mp3Path, text);
        }

        function switchSection(section) {
            currentSection = section;
            currentIndex = 0;
            renderTabs();
            renderCard();
            updateNavButtons();
            const names = { vowels: '元音', consonants: '辅音' };
            showMascot(`我们来学${names[section]}！`);
        }

        function switchItem(direction) {
            const section = alphabetData[currentSection];
            const oldCard = document.getElementById('cardContainer').firstElementChild;
            let newIndex = currentIndex;
            if (direction === 'next') newIndex = (currentIndex + 1) % section.length;
            else if (direction === 'prev') newIndex = (currentIndex - 1 + section.length) % section.length;
            if (newIndex === currentIndex) return;
            if (oldCard) {
                oldCard.classList.remove('slide-left-in', 'slide-right-in');
                oldCard.classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            }
            currentIndex = newIndex;
            renderCard();
            const newCard = document.getElementById('cardContainer').firstElementChild;
            if (newCard) {
                newCard.classList.remove('slide-left-out', 'slide-right-out');
                newCard.classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            }
            updateNavButtons();
            setTimeout(playCurrent, 300);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }

        let touchStartX = 0, touchEndX = 0;
        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;
            mainStage.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            mainStage.addEventListener('touchend', function(e) { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });
            let mouseDown = false;
            mainStage.addEventListener('mousedown', function(e) { mouseDown = true; touchStartX = e.screenX; });
            mainStage.addEventListener('mouseup', function(e) { if (!mouseDown) return; mouseDown = false; touchEndX = e.screenX; handleSwipe(); });
            mainStage.addEventListener('mouseleave', function() { mouseDown = false; });
        }

        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > swipeThreshold) { if (diff > 0) nextItem(); else prevItem(); }
        }

        function startApp() {
            if (appStarted) return;
            appStarted = true;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
            }
            const silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
            silentAudio.play().catch(() => {});
            showMascot('你好！我是小豆。我们先从元音字母开始学英语吧！');
            XiaoDou.speak('你好！我是小豆。我们先从元音字母开始学英语吧！', 'zh');
        }

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'alphabet_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
        startApp();
    </script>
</body>
</html>
