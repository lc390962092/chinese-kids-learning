<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 数字王国</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #E0F2F1 0%, #FFF3E0 100%); min-height: 100vh; overflow-x: hidden; }
        .header { text-align: center; padding: 20px 10px 10px; }
        .header h1 { color: #00897B; font-size: 28px; margin-bottom: 5px; }
        .header p { color: #888; font-size: 14px; }
        .mascot { text-align: center; padding: 10px; }
        .mascot-bubble { display: inline-block; background: white; border-radius: 25px; padding: 12px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #555; font-size: 16px; max-width: 80%; position: relative; margin-bottom: 15px; }
        .mascot-bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .mascot-avatar { width: 60px; height: 60px; background: #FFD93D; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .main-stage { background: white; border-radius: 30px 30px 0 0; min-height: 60vh; padding: 25px 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); touch-action: pan-y; }; position: relative; }
        .card { display: none; text-align: center; animation: fadeIn 0.5s ease; }
        .card.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-number { width: 220px; height: 220px; margin: 10px auto; background: #f8f8f8; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; user-select: none; font-size: 120px; font-weight: bold; color: #00897B; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .card-number:active { transform: scale(0.95); }
        .card-title { font-size: 40px; color: #333; margin: 10px 0 5px; font-weight: bold; }
        .card-subtitle { font-size: 22px; color: #888; margin-bottom: 5px; }
        .card-japanese { font-size: 24px; color: #555; margin: 5px 0 0; font-weight: bold; }
        .card-japanese-reading { font-size: 16px; color: #999; margin-bottom: 12px; }
        .card-english { font-size: 24px; color: #3F51B5; margin: 5px 0 0; font-weight: bold; }
        .card-english-reading { font-size: 16px; color: #7986CB; margin-bottom: 12px; }
        .card-text { background: #f8f8f8; border-radius: 20px; padding: 18px 20px; margin: 10px auto 15px; max-width: 90%; text-align: left; font-size: 18px; line-height: 1.7; color: #444; }
        .keywords { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0; padding: 0 10px; }
        .keyword { background: #f0f0f0; color: #555; padding: 8px 16px; border-radius: 20px; font-size: 16px; cursor: pointer; }
        .keyword:active { background: #ddd; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .btn { border: none; border-radius: 25px; padding: 12px 20px; font-size: 16px; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #00897B; }
        .btn-secondary { background: #4ECDC4; }
        .btn-japanese { background: #FF7043; }
        .btn-english { background: #3F51B5; }
        .nav-btns { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .nav-btn { background: #80CBC4; color: #333; border: none; border-radius: 25px; padding: 12px 30px; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .nav-btn:active { transform: scale(0.95); }
        .progress { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
        .progress-dot.active { background: #00897B; }
        .swipe-hint { color: #bbb; font-size: 12px; margin-top: 8px; text-align: center; }
        .start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #E0F2F1 0%, #FFF3E0 100%); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .start-content { background: white; padding: 40px 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 320px; width: 90%; }
        .start-panda { font-size: 80px; margin-bottom: 10px; }
        .start-content h2 { color: #00897B; font-size: 32px; margin-bottom: 10px; }
        .start-content p { color: #888; font-size: 16px; margin-bottom: 25px; }
        .start-btn { background: #00897B; color: white; border: none; border-radius: 30px; padding: 15px 50px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .start-btn:active { transform: scale(0.95); }
        .back-home { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px; }
        .back-bar { display: block; padding: 12px 15px; color: #666; text-decoration: none; font-size: 15px; background: rgba(255,255,255,0.5); backdrop-filter: blur(5px); }
        .loading, .error { text-align: center; padding: 40px 20px; color: #666; }
        .error { color: #E53935; }
        @media (max-width: 400px) { .card-number { width: 180px; height: 180px; font-size: 100px; } .card-title { font-size: 34px; } }                .stage-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            border: none;
            box-shadow: 0 3px 12px rgba(0,0,0,0.18);
            font-size: 22px;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: transform 0.2s, background 0.2s;
        }
        .stage-arrow:active { transform: translateY(-50%) scale(0.9); background: #f0f0f0; }
        .stage-arrow-left { left: 8px; }
        .stage-arrow-right { right: 8px; }

    </style>
    <link rel="stylesheet" href="dark-mode.css?v=2">
</head>
<body>
    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🔢 小豆中文</h1>
        <p>今天我们来学习数字</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击数字，跟小豆一起读～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="main-stage" id="mainStage">
        <button class="stage-arrow stage-arrow-left" onclick="prevItem()" aria-label="上一个">❮</button>
        <button class="stage-arrow stage-arrow-right" onclick="nextItem()" aria-label="下一个">❯</button>
        <div id="loading" class="loading">正在加载数字卡片...</div>
        <div id="error" class="error" style="display:none;">加载失败，请检查网络后刷新。</div>
        <div id="cards" style="display:none;"></div>
        <div class="progress" id="progressDots" style="display:none;"></div>
        <div class="swipe-hint" id="swipeHint" style="display:none;">← 左右滑动切换卡片 →</div>
        <a href="index.html" class="back-home">⬅️ 返回首页</a>
    </div>
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <div class="start-panda">🐼</div>
            <h2>数字王国</h2>
            <p>和小豆一起认识中文数字吧！</p>
            <button class="start-btn" onclick="startApp()">开始</button>
        </div>
</div>
    <script src="js/common.js"></script>
    <script>
        let items = [];
        let currentIndex = 0;
        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        const SWIPE_THRESHOLD = 50;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('numbers');
                items = XiaoDou.getItems(data);
                if (!items.length) throw new Error('没有数据');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('cards').style.display = 'block';
                document.getElementById('progressDots').style.display = 'flex';
                document.getElementById('swipeHint').style.display = 'block';
                renderCards();
                renderProgress();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                console.error(err);
            }
        }

        function showMascot(text){ document.getElementById('mascotText').textContent = text; }

        function playWord(index){
            const item = items[index];
            XiaoDou.speak(item.word, 'zh');
            showMascot('我们来看看：' + item.word + '，' + item.pinyin + '。');
        }

        function playSentence(index){
            const item = items[index];
            XiaoDou.speak(item.sentence, 'zh');
            showMascot(item.sentence);
        }

        function playJapanese(index) {
            const item = items[index];
            const mp3Path = `assets/audio/numbers/japanese/${item.word}_japanese.mp3`;
            XiaoDou.playAudio(mp3Path, item.japanese_reading, 'ja');
            showMascot('日语：' + item.word + ' → ' + item.japanese + '（' + item.japanese_reading + '）');
        }

        function playEnglish(index){
            const item = items[index];
            XiaoDou.speak(item.english, 'en');
            showMascot('English: ' + item.english + '。');
        }

        function escapeAttr(text) {
            return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
        }

        function renderCards(){
            const container = document.getElementById('cards');
            container.innerHTML = items.map((item, i) => {
                const keywords = (item.tags || []).map(w => `<span class="keyword" onclick="XiaoDou.speak('${escapeAttr(w)}', 'zh')">${XiaoDou.escapeHtml(w)}</span>`).join('');
                return `<div class="card ${i===0?'active':''}">
                    <div class="card-number" onclick="playWord(${i})">${XiaoDou.escapeHtml(item.arabic)}</div>
                    <div class="card-title">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="card-subtitle">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="card-japanese">${XiaoDou.escapeHtml(item.japanese)}</div>
                    <div class="card-japanese-reading">${XiaoDou.escapeHtml(item.japanese_reading)}</div>
                    <div class="card-english">${XiaoDou.escapeHtml(item.english)}</div>
                    <div class="card-text">${XiaoDou.escapeHtml(item.sentence)}</div>
                    <div class="keywords">${keywords}</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="playWord(${i})">🔊 读数字</button>
                        <button class="btn btn-japanese" onclick="playJapanese(${i})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${i})">🇺🇸 英语</button>
                        <button class="btn btn-secondary" onclick="playSentence(${i})">📝 读句子</button>
                    </div>
                    <div class="nav-btns">
                        <button class="nav-btn" onclick="prevItem()">⬅️ 上一个</button>
                        <button class="nav-btn" onclick="nextItem()">下一个 ➡️</button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderProgress(){
            const dots = document.getElementById('progressDots');
            dots.innerHTML = items.map((_, i) => `<div class="progress-dot ${i===0?'active':''}"></div>`).join('');
        }

        function switchCard(direction){
            if (!items.length) return;
            const cards = document.querySelectorAll('.card');
            const dots = document.querySelectorAll('.progress-dot');
            cards[currentIndex].classList.remove('active');
            dots[currentIndex].classList.remove('active');
            if (direction === 'next') currentIndex = (currentIndex + 1) % items.length;
            else currentIndex = (currentIndex - 1 + items.length) % items.length;
            cards[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
            const item = items[currentIndex];
            XiaoDou.speak(item.word, 'zh');
            showMascot('我们来看看：' + item.word + '，' + item.pinyin + '。');
        }

        function nextItem(){ switchCard('next'); }
        function prevItem(){ switchCard('prev'); }

        function startApp(){
            document.getElementById('startOverlay').style.display = 'none';
            if (items.length){
                XiaoDou.speak('你好！我是小豆。今天我们来学习数字。', 'zh');
                showMascot('你好！我是小豆。今天我们来学习数字。');
            }
        }

        const mainStage = document.getElementById('mainStage');
        mainStage.addEventListener('touchstart', function(e){
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });
        mainStage.addEventListener('touchend', function(e){
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = touchStartX - endX;
            const diffY = touchStartY - endY;
            const timeDiff = Date.now() - touchStartTime;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD && timeDiff < 500){
                if (diffX > 0) nextItem(); else prevItem();
            }
        }, { passive: true });

        init();
    </script>
</body>
</html>
