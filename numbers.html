<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 数字王国</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #00897B;
            --bg-gradient: linear-gradient(135deg, #E0F2F1 0%, #FFF8E1 100%);
        }
    </style><link rel="stylesheet" href="dark-mode.css?v=2">
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🔢 小豆中文</h1>
        <p>今天我们来学习数字</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击数字，跟小豆一起读～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="main-stage" id="mainStage">
        <div id="loading" class="loading">正在加载数字卡片...</div>
        <div id="error" class="error" style="display:none;">加载失败，请检查网络后刷新。</div>
        <div id="cards" style="display:none;"></div>
        <div class="progress" id="progressDots" style="display:none;"></div>
        <div class="swipe-hint" id="swipeHint" style="display:none;">← 左右滑动切换卡片 →</div>
        <a href="index.html" class="back-home">⬅️ 返回首页</a>
    </div>
    
    <script src="js/common.js"></script>
    <script>
        let items = [];
        let currentIndex = 0;
        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        const SWIPE_THRESHOLD = 50;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('numbers');
                items = XiaoDou.getItems(data);
                if (!items.length) throw new Error('没有数据');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('cards').style.display = 'block';
                document.getElementById('progressDots').style.display = 'flex';
                document.getElementById('swipeHint').style.display = 'block';
                renderCards();
                renderProgress();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                console.error(err);
            }
        }

        function showMascot(text){ document.getElementById('mascotText').textContent = text; }

        function playWord(index){
            const item = items[index];
            XiaoDou.speak(item.word, 'zh');
            showMascot('我们来看看：' + item.word + '，' + item.pinyin + '。');
        }

        function playSentence(index){
            const item = items[index];
            XiaoDou.speak(item.sentence, 'zh');
            showMascot(item.sentence);
        }

        function playJapanese(index) {
            const item = items[index];
            const mp3Path = `assets/audio/numbers/japanese/${item.word}_japanese.mp3`;
            XiaoDou.playAudio(mp3Path, item.japanese_reading, 'ja');
            showMascot('日语：' + item.word + ' → ' + item.japanese + '（' + item.japanese_reading + '）');
        }

        function playEnglish(index){
            const item = items[index];
            XiaoDou.speak(item.english, 'en');
            showMascot('English: ' + item.english + '。');
        }

        function escapeAttr(text) {
            return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
        }

        function renderCards(){
            const container = document.getElementById('cards');
            container.innerHTML = items.map((item, i) => {
                const keywords = (item.tags || []).map(w => `<span class="keyword" onclick="XiaoDou.speak('${escapeAttr(w)}', 'zh')">${XiaoDou.escapeHtml(w)}</span>`).join('');
                return `<div class="card ${i===0?'active':''}">
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="prevItem()">◀</button>
                    <div class="card-number" onclick="playWord(${i})">${XiaoDou.escapeHtml(item.arabic)}</div>
                        <button class="side-arrow right" onclick="nextItem()">▶</button>
                    </div>
                    <div class="card-title">${XiaoDou.escapeHtml(item.word)}</div>
                    <div class="card-subtitle">${XiaoDou.escapeHtml(item.pinyin)}</div>
                    <div class="card-japanese">${XiaoDou.escapeHtml(item.japanese)}</div>
                    <div class="card-japanese-reading">${XiaoDou.escapeHtml(item.japanese_reading)}</div>
                    <div class="card-english">${XiaoDou.escapeHtml(item.english)}</div>
                    <div class="keywords">${keywords}</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="playWord(${i})">🔊 读数字</button>
                        <button class="btn btn-japanese" onclick="playJapanese(${i})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${i})">🇺🇸 英语</button>
                        <button class="btn btn-secondary" onclick="playSentence(${i})">📝 读句子</button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderProgress(){
            const dots = document.getElementById('progressDots');
            dots.innerHTML = items.map((_, i) => `<div class="progress-dot ${i===0?'active':''}"></div>`).join('');
        }

        function switchCard(direction){
            if (!items.length) return;
            const cards = document.querySelectorAll('.card');
            const dots = document.querySelectorAll('.progress-dot');
            cards[currentIndex].classList.remove('active');
            dots[currentIndex].classList.remove('active');
            if (direction === 'next') currentIndex = (currentIndex + 1) % items.length;
            else currentIndex = (currentIndex - 1 + items.length) % items.length;
            cards[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
            const item = items[currentIndex];
            XiaoDou.speak(item.word, 'zh');
            showMascot('我们来看看：' + item.word + '，' + item.pinyin + '。');
        }

        function nextItem(){ switchCard('next'); }
        function prevItem(){ switchCard('prev'); }

        function startApp(){
            if (items.length){
                XiaoDou.speak('你好！我是小豆。今天我们来学习数字。', 'zh');
                showMascot('你好！我是小豆。今天我们来学习数字。');
            }
        }

        const mainStage = document.getElementById('mainStage');
        mainStage.addEventListener('touchstart', function(e){
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });
        mainStage.addEventListener('touchend', function(e){
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = touchStartX - endX;
            const diffY = touchStartY - endY;
            const timeDiff = Date.now() - touchStartTime;
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD && timeDiff < 500){
                if (diffX > 0) nextItem(); else prevItem();
            }
        }, { passive: true });

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'numbers_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
        startApp();
        startApp();
    </script>
</body>
</html>
