<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 认识食物</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #FF9800;
            --bg-gradient: linear-gradient(135deg, #FFF8E7 0%, #FFF0F5 100%);
        }
        body {
            overscroll-behavior-x: none;
            touch-action: manipulation;
        }
        .main-stage {
            touch-action: pan-y;
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
            width: 240px;
            height: 240px;
            margin: 10px auto;
        }
        .side-arrow.left { left: -50px; }
        .side-arrow.right { right: -50px; }
        .btn-group { gap: 15px; }
        .btn { padding: 12px 25px; transition: transform 0.2s, box-shadow 0.2s; }
        body.kidlock .back-bar,
        body.kidlock .bottom-home {
            display: none !important;
        }
        body.kidlock .main-stage {
            touch-action: none;
        }
    </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="FlipCard.toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>

    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来认识食物</p>
    </div>
    
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击食物图片，听听它叫什么名字～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    
    <div class="main-stage">
        <div id="foodCards"></div>
        
        <div class="progress" id="progressDots"></div>
        
        <div class="bottom-home" style="text-align:center;margin-top:25px;">
            <a href="index.html" style="color:#888;text-decoration:none;font-size:14px;">← 回首页</a>
        </div>
    </div>
    
    <div class="stars" id="starEffect">⭐</div>

    <script src="js/common.js"></script>
    <script src="js/flip-card.js"></script>
    <script>
        let foods = [];
        let currentIndex = 0;

        async function loadFoods() {
            try {
                const data = await XiaoDou.loadModule('food');
                foods = XiaoDou.getItems(data);
                renderCards();
                FlipCard.setupSwipe(nextFood, prevFood);
                updateNavButtons();
            } catch (err) {
                console.error('加载食物数据失败:', err);
                FlipCard.showMascot('食物数据加载失败，请刷新页面试试～');
            }
        }

        function showMascot(text) { FlipCard.showMascot(text); }

        function updateNavButtons() {
            FlipCard.updateNavButtons({ current: currentIndex, total: foods.length });
        }

        function renderCards() {
            const container = document.getElementById('foodCards');
            const progress = document.getElementById('progressDots');
            container.innerHTML = '';
            progress.innerHTML = '';

            foods.forEach((food, index) => {
                const card = document.createElement('div');
                card.className = 'food-card' + (index === 0 ? ' active' : '');
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="prevFood()" aria-label="上一个">◀</button>
                        <img class="food-image"
                             src="${XiaoDou.resolvePath(`assets/images/food/${food.file}.png`)}"
                             alt="${XiaoDou.escapeHtml(food.word)}"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                             onclick="playWord(${index})">
                        <div class="food-image food-emoji-fallback" style="display:none;align-items:center;justify-content:center;font-size:100px;background:#fff8f0;border-radius:24px;" aria-label="${XiaoDou.escapeHtml(food.word)} 占位图">🍽️</div>
                        <button class="side-arrow right" onclick="nextFood()" aria-label="下一个">▶</button>
                    </div>
                    <div class="food-word">${XiaoDou.escapeHtml(food.word)}</div>
                    <div class="food-pinyin">${XiaoDou.escapeHtml(food.pinyin)}</div>
                    <div class="food-japanese">${XiaoDou.escapeHtml(food.japanese)}（${XiaoDou.escapeHtml(food.japanese_reading)}）</div>
                    <div class="food-english">${XiaoDou.escapeHtml(food.english)}</div>
                    <div class="btn-group">
                        <button class="btn btn-word" onclick="playWord(${index})">🔊 读音</button>
                        <button class="btn btn-sentence" onclick="playSentence(${index})">📝 句子</button>
                        <button class="btn btn-measure" onclick="playMeasure(${index})">🥣 量词</button>
                        <button class="btn btn-japanese" onclick="playJapanese(${index})">🇯🇵 日语</button>
                        <button class="btn btn-english" onclick="playEnglish(${index})">🇺🇸 英语</button>
                        <button class="btn btn-encyclopedia" onclick="playEncyclopedia(${index})">📖 百科</button>
                    </div>
                    <div class="encyclopedia-card" id="encyclopedia-${index}" style="display:none;">
                        <div class="encyclopedia-title">📖 ${XiaoDou.escapeHtml(food.word)} 小百科</div>
                        <div class="encyclopedia-item"><strong>简介：</strong>${XiaoDou.escapeHtml(food.intro || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>从哪里来：</strong>${XiaoDou.escapeHtml(food.where || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>怎么吃：</strong>${XiaoDou.escapeHtml(food.use || '待补充')}</div>
                        <div class="encyclopedia-item"><strong>小知识：</strong>${XiaoDou.escapeHtml(food.fun_fact || '待补充')}</div>
                    </div>
                `;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });
            updateNavButtons();
        }

        function playWord(index) {
            const food = foods[index];
            const mp3Path = `assets/audio/food/${food.file}_word.mp3`;
            FlipCard.speakWithFallback(`${food.word}，${food.pinyin}`, mp3Path);
            showMascot(`我们来看看：${food.word}，${food.pinyin}。`);
            FlipCard.showStars();
        }

        function playSentence(index) {
            const food = foods[index];
            const mp3Path = `assets/audio/food/sentences/${food.file}_sentence.mp3`;
            FlipCard.speakWithFallback(food.sentence, mp3Path);
            showMascot(food.sentence);
        }

        function playMeasure(index) {
            const food = foods[index];
            const text = `一${food.measure_word}${food.word}`;
            const mp3Path = `assets/audio/food/${food.file}_measure.mp3`;
            FlipCard.speakWithFallback(text, mp3Path);
            showMascot(`一${food.measure_word}${food.word}。`);
            FlipCard.showStars();
        }

        function playJapanese(index) {
            const food = foods[index];
            const mp3Path = `assets/audio/food/japanese/${food.file}_japanese.mp3`;
            FlipCard.speakWithFallback(food.japanese_reading, mp3Path, 'ja-JP', 0.75);
            showMascot(`${food.word} 的日语是：${food.japanese}（${food.japanese_reading}）`);
        }

        function playEnglish(index) {
            const food = foods[index];
            const mp3Path = `assets/audio/food/english/${food.file}_english.mp3`;
            FlipCard.speakWithFallback(food.english, mp3Path, 'en-US', 0.85);
            showMascot(`${food.word} 的英语是：${food.english}`);
        }

        function playEncyclopedia(index) {
            const food = foods[index];
            if (!food.intro) {
                showMascot(`${food.word} 的百科内容还在准备中，先听听别的吧～`);
                return;
            }
            const text = `${food.intro}${food.where}${food.use}${food.fun_fact}`;
            const mp3Path = `assets/audio/food/encyclopedia/${food.file}_encyclopedia.mp3`;
            FlipCard.speakWithFallback(text, mp3Path, 'zh-CN', 0.8);
            showMascot(`${food.word}的小百科：${food.intro}`);

            const card = document.getElementById(`encyclopedia-${index}`);
            if (card) {
                card.style.display = card.style.display === 'none' ? 'block' : 'none';
            }
        }

        function switchFood(direction) {
            FlipCard.stopAllAudio();
            const cards = document.querySelectorAll('.food-card');
            const dots = document.querySelectorAll('.progress-dot');
            if (!cards.length) return;

            let newIndex;
            if (direction === 'next') {
                newIndex = (currentIndex + 1) % foods.length;
            } else {
                newIndex = (currentIndex - 1 + foods.length) % foods.length;
            }
            if (newIndex === currentIndex) return;

            cards[currentIndex].classList.remove('active');
            cards[currentIndex].classList.remove('slide-left-in', 'slide-right-in');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-out' : 'slide-right-out');
            dots[currentIndex].classList.remove('active');

            currentIndex = newIndex;
            document.querySelectorAll('.encyclopedia-card').forEach(el => el.style.display = 'none');

            cards[currentIndex].classList.remove('slide-left-out', 'slide-right-out');
            cards[currentIndex].classList.add('active');
            cards[currentIndex].classList.add(direction === 'next' ? 'slide-left-in' : 'slide-right-in');
            dots[currentIndex].classList.add('active');

            updateNavButtons();
            const food = foods[currentIndex];
            showMascot(`我们来学${food.word}！`);
            setTimeout(() => playWord(currentIndex), 500);
        }

        function nextFood() { switchFood('next'); }
        function prevFood() { switchFood('prev'); }

        // 初始化
        FlipCard.kidLockKey = 'food_kidlock';
        FlipCard.initKidLock();
        FlipCard.startApp('你好！我是小豆。今天我们来学习常用食物。点击食物图片，听听它叫什么名字。');
        loadFoods();
    </script>
</body>
</html>
