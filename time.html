<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 时间</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #1976D2;
            --bg-gradient: linear-gradient(135deg, #E3F2FD 0%, #FFF3E0 100%);
        }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>

    <div class="header">
        <h1>🐼 小豆时间</h1>
        <p>时段 · 整点 · 星期 · 日期</p>
    </div>

    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！我是小豆，今天我们一起认识时间吧～</div>
        <div class="mascot-avatar">🐼</div>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-section="periods">时段</button>
        <button class="tab-btn" data-section="hours">整点</button>
        <button class="tab-btn" data-section="weekdays">星期</button>
        <button class="tab-btn" data-section="dates">日期</button>
    </div>

    <div class="main-stage">
        <div class="card-wrapper">
            <button class="side-arrow left" id="prevBtn" onclick="prevItem()" aria-label="上一个">◀</button>
            <div id="cardContainer"></div>
            <button class="side-arrow right" id="nextBtn" onclick="nextItem()" aria-label="下一个">▶</button>
        </div>

        <a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#888;text-decoration:none;font-size:14px;">← 回首页</a>

        <div class="progress" id="progressDots"></div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let timeData = { periods: [], hours: [], weekdays: [], dates: [] };
        let currentSection = 'periods';
        let currentIndex = 0;
        let appStarted = false;

        const sectionConfig = {
            periods: { name: '时段', prefix: 'time', hasClock: true },
            hours: { name: '整点', prefix: 'time', hasClock: true },
            weekdays: { name: '星期', prefix: 'weekday', hasClock: false },
            dates: { name: '日期', prefix: 'date', hasClock: false }
        };

        const weekdayIcons = ['🌙','🔥','💧','🌳','💰','🌍','☀️'];
        const weekdayColors = ['#E3F2FD','#FFEBEE','#E1F5FE','#E8F5E9','#FFF8E1','#F3E5F5','#FFF3E0'];
        const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
        const dayNumbers = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一'];

        function parseDate(cn) {
            const m = cn.match(/([\d一二三四五六七八九十]+)月([\d一二三四五六七八九十]+)日/);
            if (!m) return { month: '今天', day: '' };
            const monthIdx = monthNames.indexOf(m[1]) + 1;
            const dayIdx = dayNumbers.indexOf(m[2]) + 1;
            return { month: monthIdx > 0 ? monthIdx + '月' : m[1], day: dayIdx > 0 ? dayIdx : m[2] };
        }

        async function init() {
            try {
                const data = await XiaoDou.loadModule('time');
                for (const sec of (data.sections || [])) {
                    if (timeData[sec.id] !== undefined) timeData[sec.id] = sec.items || [];
                }
                renderTabs();
                renderCard();
                updateNavButtons();
                setupSwipe();
            } catch (err) {
                console.error('加载时间数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">时间数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function getField(item, lang, field) {
            const cfg = sectionConfig[currentSection];
            const prefix = cfg.prefix;
            if (lang === 'zh') return item[`${prefix}_cn`] || item.sentence_cn || '';
            if (lang === 'en') return item[`${prefix}_en`] || item.sentence_en || '';
            if (lang === 'ja') return item[`${prefix}_ja_kana`] || item[`${prefix}_ja`] || '';
            return '';
        }

        function getAudioPath(section, index, lang) {
            return XiaoDou.resolvePath(`assets/audio/time/${section}/${String(index).padStart(2, '0')}/${lang}.mp3`);
        }

        function getSentenceAudioPath(section, index, lang) {
            const sentenceLang = lang === 'zh' ? 'cn_zh' : (lang === 'en' ? 'cn_en' : 'cn_ja');
            return XiaoDou.resolvePath(`assets/audio/time/${section}/sentences/${String(index).padStart(2, '0')}/${sentenceLang}.mp3`);
        }

        function playAudioLang(lang) {
            const item = timeData[currentSection][currentIndex];
            const cfg = sectionConfig[currentSection];
            const word = getField(item, lang, cfg.prefix);
            const sentence = item[`sentence_${lang === 'zh' ? 'cn' : (lang === 'en' ? 'en' : 'ja_kana')}`] || '';
            const text = sentence ? `${word}。${sentence}` : word;
            const mp3Path = getAudioPath(currentSection, currentIndex, lang);
            XiaoDou.playAudio(mp3Path, text, lang).then(async (ok) => {
                if (ok) {
                    await new Promise(r => setTimeout(r, 600));
                    const sentencePath = getSentenceAudioPath(currentSection, currentIndex, lang);
                    XiaoDou.playAudio(sentencePath, null, lang);
                }
            });
        }

        function renderTabs() {
            const tabs = document.getElementById('tabs');
            tabs.innerHTML = '';
            for (const key of Object.keys(sectionConfig)) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (key === currentSection ? ' active' : '');
                btn.textContent = sectionConfig[key].name;
                btn.onclick = () => switchSection(key);
                tabs.appendChild(btn);
            }
        }

        function renderClock(hour, minute) {
            const cx = 100, cy = 100, r = 90;
            const hourAngle = (hour % 12) * 30 + minute * 0.5;
            const minuteAngle = minute * 6;
            // 指针末端距离中心更远（接近但不接触数字）
            const hourLen = 48;
            const minuteLen = 68;
            // 指针起点离中心留空，避免压住数字
            const hourStart = 16;
            const minuteStart = 20;

            const hx = cx + Math.sin(hourAngle * Math.PI / 180) * hourLen;
            const hy = cy - Math.cos(hourAngle * Math.PI / 180) * hourLen;
            const mx = cx + Math.sin(minuteAngle * Math.PI / 180) * minuteLen;
            const my = cy - Math.cos(minuteAngle * Math.PI / 180) * minuteLen;
            const hxStart = cx + Math.sin(hourAngle * Math.PI / 180) * hourStart;
            const hyStart = cy - Math.cos(hourAngle * Math.PI / 180) * hourStart;
            const mxStart = cx + Math.sin(minuteAngle * Math.PI / 180) * minuteStart;
            const myStart = cy - Math.cos(minuteAngle * Math.PI / 180) * minuteStart;

            let markers = '';
            for (let i = 0; i < 12; i++) {
                const angle = i * 30;
                const is12 = i === 0;
                const isQuarter = i % 3 === 0; // 3, 6, 9
                const mr = is12 ? 60 : (isQuarter ? 45 : 25);
                const mw = is12 ? 4 : (isQuarter ? 3 : 2);
                const x1 = cx + Math.sin(angle * Math.PI / 180) * (r - 10);
                const y1 = cy - Math.cos(angle * Math.PI / 180) * (r - 10);
                const x2 = cx + Math.sin(angle * Math.PI / 180) * (r - 10 - mr);
                const y2 = cy - Math.cos(angle * Math.PI / 180) * (r - 10 - mr);
                markers += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#555" stroke-width="${mw}" stroke-linecap="round" />`;
                // 数字放在刻度外侧，避免与指针重叠
                const tr = r - 32;
                const tx = cx + Math.sin(angle * Math.PI / 180) * tr;
                const ty = cy - Math.cos(angle * Math.PI / 180) * tr;
                const label = is12 ? '12' : i;
                markers += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#555" font-weight="bold">${label}</text>`;
            }

            return `
                <svg class="clock-svg" viewBox="0 0 200 200">
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#1976D2" stroke-width="6" />
                    ${markers}
                    <line x1="${hxStart}" y1="${hyStart}" x2="${hx}" y2="${hy}" stroke="#333" stroke-width="5" stroke-linecap="round" />
                    <line x1="${mxStart}" y1="${myStart}" x2="${mx}" y2="${my}" stroke="#E53935" stroke-width="3" stroke-linecap="round" />
                    <circle cx="${cx}" cy="${cy}" r="5" fill="#1976D2" />
                </svg>
            `;
        }

        function renderVisual(item) {
            const cfg = sectionConfig[currentSection];
            if (cfg.hasClock) {
                return `<div class="clock-wrap">${renderClock(item.hour || 0, item.minute || 0)}</div>`;
            }
            if (currentSection === 'weekdays') {
                const idx = currentIndex % weekdayIcons.length;
                return `<div class="weekday-icon" style="background:${weekdayColors[idx]};">${weekdayIcons[idx]}</div>`;
            }
            if (currentSection === 'dates') {
                const parsed = parseDate(item.date_cn);
                return `
                    <div class="date-calendar">
                        <div class="month">${parsed.month}</div>
                        <div class="day">${parsed.day}</div>
                    </div>
                `;
            }
            return '';
        }

        function renderCard() {
            const container = document.getElementById('cardContainer');
            const section = timeData[currentSection];
            if (!section || section.length === 0) return;
            const item = section[currentIndex];
            const cfg = sectionConfig[currentSection];
            const wordKey = `${cfg.prefix}_cn`;
            const enKey = `${cfg.prefix}_en`;
            const jaKey = `${cfg.prefix}_ja`;
            const jaKanaKey = `${cfg.prefix}_ja_kana`;

            container.innerHTML = `
                ${renderVisual(item)}
                <div class="time-word">${XiaoDou.escapeHtml(item[wordKey])}</div>
                <div class="time-word-sub">
                    <span>${XiaoDou.escapeHtml(item[enKey])}</span>
                    <span>${XiaoDou.escapeHtml(item[jaKey])}<small class="kana">${XiaoDou.escapeHtml(item[jaKanaKey])}</small></span>
                </div>
                <div class="sentence-box">
                    <div class="sentence-row">
                        <div class="sentence-lang zh">中</div>
                        <div class="sentence-text">${XiaoDou.escapeHtml(item.sentence_cn)}</div>
                    </div>
                    <div class="sentence-row">
                        <div class="sentence-lang en">英</div>
                        <div class="sentence-text">${XiaoDou.escapeHtml(item.sentence_en)}</div>
                    </div>
                    <div class="sentence-row">
                        <div class="sentence-lang ja">日</div>
                        <div class="sentence-text">${XiaoDou.escapeHtml(item.sentence_ja)}<span class="kana">${XiaoDou.escapeHtml(item.sentence_ja_kana)}</span></div>
                    </div>
                </div>
                <div class="play-row">
                    <button class="btn-play" onclick="playAudioLang('zh')">🔊 中文</button>
                    <button class="btn-play" onclick="playAudioLang('en')">🔊 English</button>
                    <button class="btn-play" onclick="playAudioLang('ja')">🔊 日本語</button>
                </div>
            `;
            renderProgress();
            updateNavButtons();
        }

        function renderProgress() {
            const progress = document.getElementById('progressDots');
            const count = timeData[currentSection].length;
            progress.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot' + (i === currentIndex ? ' active' : '');
                progress.appendChild(dot);
            }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = false;
            document.getElementById('nextBtn').disabled = false;
        }

        function playCurrent() {
            const item = timeData[currentSection][currentIndex];
            playAudioLang('zh');
            const cfg = sectionConfig[currentSection];
            const word = item[`${cfg.prefix}_cn`];
            showMascot(`${word}，英文是 ${item[`${cfg.prefix}_en`]}，日文是 ${item[`${cfg.prefix}_ja`]}（${item[`${cfg.prefix}_ja_kana`]}）。${item.sentence_cn}`);
        }

        function switchSection(section) {
            currentSection = section;
            currentIndex = 0;
            renderTabs();
            renderCard();
            updateNavButtons();
            showMascot(`我们来学${sectionConfig[section].name}！`);
        }

        function switchItem(direction) {
            const section = timeData[currentSection];
            let newIndex = currentIndex;
            if (direction === 'next') newIndex = (currentIndex + 1) % section.length;
            else if (direction === 'prev') newIndex = (currentIndex - 1 + section.length) % section.length;
            if (newIndex === currentIndex) return;
            currentIndex = newIndex;
            renderCard();
            updateNavButtons();
            setTimeout(playCurrent, 200);
        }

        function nextItem() { switchItem('next'); }
        function prevItem() { switchItem('prev'); }

        let touchStartX = 0, touchEndX = 0;
        function setupSwipe() {
            const mainStage = document.querySelector('.main-stage');
            if (!mainStage) return;
            mainStage.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            mainStage.addEventListener('touchend', function(e) { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });
            let mouseDown = false;
            mainStage.addEventListener('mousedown', function(e) { mouseDown = true; touchStartX = e.screenX; });
            mainStage.addEventListener('mouseup', function(e) { if (!mouseDown) return; mouseDown = false; touchEndX = e.screenX; handleSwipe(); });
            mainStage.addEventListener('mouseleave', function() { mouseDown = false; });
        }

        function handleSwipe() {
            if (kidLockOn) return; // 儿童锁：禁用滑动翻页
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > swipeThreshold) { if (diff > 0) nextItem(); else prevItem(); }
        }

        function startApp() {
            if (appStarted) return;
            appStarted = true;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
            }
            const silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
            silentAudio.play().catch(() => {});
            showMascot('你好！我是小豆。我们先从时段开始认识时间吧！');
            XiaoDou.speak('你好！我是小豆。我们先从时段开始认识时间吧！', 'zh');
        }

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'time_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
        startApp();
    </script>
</body>
</html>
