<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 童话故事</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #E8F5E9 0%, #FFF0F5 100%); min-height: 100vh; overflow-x: hidden; }
        .header { text-align: center; padding: 20px 10px 10px; }
        .header h1 { color: #43A047; font-size: 28px; margin-bottom: 5px; }
        .header p { color: #888; font-size: 14px; }
        .mascot { text-align: center; padding: 10px; }
        .mascot-bubble { display: inline-block; background: white; border-radius: 25px; padding: 12px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #555; font-size: 16px; max-width: 80%; position: relative; margin-bottom: 15px; }
        .mascot-bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .mascot-avatar { width: 60px; height: 60px; background: #FFD93D; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .main-stage { background: white; border-radius: 30px 30px 0 0; min-height: 60vh; padding: 25px 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); touch-action: pan-y; position: relative; }
        .card { display: none; text-align: center; animation: fadeIn 0.5s ease; }
        .card.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-emoji { width: 160px; height: 160px; font-size: 100px; line-height: 160px; margin: 8px auto; background: #f8f8f8; border-radius: 28px; cursor: pointer; transition: transform 0.2s; user-select: none; }
        .card-emoji:active { transform: scale(0.95); }
        .card-title { font-size: 34px; color: #333; margin: 30px 0 4px; font-weight: bold; }
        .card-subtitle { font-size: 18px; color: #888; margin-bottom: 10px; }
        .card-summary { background: #FFF8E7; border-radius: 18px; padding: 12px 16px; margin: 10px auto; max-width: 94%; text-align: left; font-size: 16px; line-height: 1.5; color: #5D4037; }
        .card-story { background: #f8f8f8; border-radius: 18px; padding: 14px 16px; margin: 10px auto; max-width: 94%; text-align: left; font-size: 15px; line-height: 1.7; color: #444; max-height: 220px; overflow-y: auto; }
        .card-story p { margin-bottom: 8px; text-indent: 2em; }
        .card-moral { background: #E8F5E9; border-radius: 18px; padding: 12px 16px; margin: 10px auto; max-width: 94%; text-align: left; font-size: 15px; line-height: 1.5; color: #2E7D32; }
        .keywords { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 12px 0; padding: 0 8px; }
        .keyword { background: #f0f0f0; color: #555; padding: 6px 12px; border-radius: 18px; font-size: 14px; cursor: pointer; }
        .keyword:active { background: #ddd; }
        .btn-group { display: flex; justify-content: center; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
        .btn { border: none; border-radius: 20px; padding: 10px 16px; font-size: 14px; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #43A047; }
        .btn-secondary { background: #4ECDC4; }
        .btn-third { background: #FFD93D; color: #333; }
        .btn-fourth { background: #AB47BC; }
        .btn-auto { background: #FF6B6B; }
        .btn-auto.playing { background: #66BB6A; }
        .nav-btns { display: flex; justify-content: center; gap: 15px; margin-top: 16px; }
        .nav-btn { background: #95E1D3; color: #333; border: none; border-radius: 25px; padding: 12px 30px; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
        .progress-dot.active { background: #43A047; }
        .hint { color: #999; font-size: 13px; margin-top: 12px; text-align: center; }
        .start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #E8F5E9 0%, #FFF0F5 100%); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .start-content { background: white; padding: 40px 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 320px; width: 90%; }
        .start-panda { font-size: 80px; margin-bottom: 10px; }
        .start-content h2 { color: #43A047; font-size: 32px; margin-bottom: 10px; }
        .start-content p { color: #888; font-size: 16px; margin-bottom: 25px; }
        .start-btn { background: #43A047; color: white; border: none; border-radius: 30px; padding: 15px 50px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .start-btn:active { transform: scale(0.95); }
        .back-home { display: block; text-align: center; margin-top: 18px; color: #888; text-decoration: none; font-size: 14px; }
        .back-bar { display: block; padding: 12px 15px; color: #666; text-decoration: none; font-size: 15px; background: rgba(255,255,255,0.5); backdrop-filter: blur(5px); }
        @media (max-width: 400px) { .card-emoji { width: 130px; height: 130px; line-height: 130px; font-size: 80px; } .card-title { font-size: 28px; } .card-story { max-height: 180px; } .btn { padding: 9px 12px; font-size: 13px; } }

        .stage-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            border: none;
            box-shadow: 0 3px 12px rgba(0,0,0,0.18);
            font-size: 22px;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: transform 0.2s, background 0.2s;
        }
        .stage-arrow:active { transform: translateY(-50%) scale(0.9); background: #f0f0f0; }
        .stage-arrow-left { left: 8px; }
        .stage-arrow-right { right: 8px; }

    </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>
    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <div class="start-panda">🐼</div>
            <h2>小豆童话故事</h2>
            <p>一起听好故事，学道理</p>
            <button class="start-btn" onclick="startApp()">开始学习</button>
        </div>
    </div>
    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来一起听好故事，学道理</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击卡片，听听怎么读～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="main-stage">
            <div id="cards"></div>
</div>

    <script src="js/common.js"></script>
    <script>
        let items = [];
        let currentIndex = 0;
        let autoPlaying = false;
        let autoPlayTimer = null;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('fairy_tales');
                items = XiaoDou.getItems(data);
                renderCards();
                showMascot('欢迎来到小豆童话故事！点击卡片，听好听的故事～');
            } catch (err) {
                console.error('加载数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">童话故事数据加载失败，请刷新再试～</div>';
            }
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function renderCards() {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            items.forEach((item, index) => {
                const wordsHtml = (item.words || []).map(w => `<span class="keyword" onclick="XiaoDou.speak('${XiaoDou.escapeHtml(w)}', 'zh')">${XiaoDou.escapeHtml(w)}</span>`).join('');
                const storyHtml = (item.story || '').split('\n').filter(p => p.trim()).map(p => `<p>${XiaoDou.escapeHtml(p)}</p>`).join('');
                const card = document.createElement('div');
                card.className = 'card' + (index === 0 ? ' active' : '');
                card.id = 'card-' + index;
                card.innerHTML = `
                    <div class="card-title">${XiaoDou.escapeHtml(item.title)}</div>
                    <div class="card-subtitle">来源：${XiaoDou.escapeHtml(item.origin)}</div>
                    <div class="card-summary"><strong>简介：</strong>${XiaoDou.escapeHtml(item.summary)}</div>
                    <div class="card-story">${storyHtml}</div>
                    <div class="card-moral"><strong>道理：</strong>${XiaoDou.escapeHtml(item.moral)}</div>
                    <div class="keywords">${wordsHtml}</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="playTitle(${index})">🔊 标题</button>
                        <button class="btn btn-secondary" onclick="playSummary(${index})">📖 简介</button>
                        <button class="btn btn-fourth" onclick="playStory(${index})">📚 故事</button>
                        <button class="btn btn-third" onclick="playMoral(${index})">💡 道理</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-auto" id="autoBtn-${index}" onclick="toggleAutoPlay()">▶️ 自动循环</button>
                    </div>
                    <div class="nav-btns">
                        <button class="nav-btn" onclick="prevItem()">⬅️ 上一个</button>
                        <button class="nav-btn" onclick="nextItem()">下一个 ➡️</button>
                    </div>
                    <div class="progress" id="progress-${index}" style="margin-top:12px;"></div>
                `;
                container.appendChild(card);
            });
            renderProgressDots();
        }

        function renderProgressDots() {
            items.forEach((_, index) => {
                const dotsContainer = document.getElementById('progress-' + index);
                if (!dotsContainer) return;
                dotsContainer.innerHTML = '';
                items.forEach((_, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'progress-dot' + (i === index ? ' active' : '');
                    dotsContainer.appendChild(dot);
                });
            });
        }

        function playTitle(index) { XiaoDou.speak(items[index].title, 'zh'); showMascot('故事：《' + items[index].title + '》'); }
        function playSummary(index) { XiaoDou.speak(items[index].summary, 'zh'); showMascot(items[index].summary); }
        function playStory(index) { XiaoDou.speak(items[index].story, 'zh'); showMascot('正在朗读《' + items[index].title + '》...'); }
        function playMoral(index) { XiaoDou.speak(items[index].moral, 'zh'); showMascot('道理：' + items[index].moral); }

        function switchCard(direction) {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;
            cards[currentIndex].classList.remove('active');
            if (direction === 'next') currentIndex = (currentIndex + 1) % items.length;
            else currentIndex = (currentIndex - 1 + items.length) % items.length;
            cards[currentIndex].classList.add('active');
            renderProgressDots();
            const item = items[currentIndex];
            showMascot('《' + item.title + '》');
            stopAutoPlay();
        }
        function nextItem() { switchCard('next'); }
        function prevItem() { switchCard('prev'); }

        function toggleAutoPlay() {
            if (autoPlaying) { stopAutoPlay(); return; }
            autoPlaying = true;
            const item = items[currentIndex];
            document.getElementById('autoBtn-' + currentIndex).textContent = '⏹️ 停止循环';
            document.getElementById('autoBtn-' + currentIndex).classList.add('playing');
            showMascot('开始自动朗读《' + item.title + '》...');
            playTitle(currentIndex);
            let step = 0;
            autoPlayTimer = setInterval(() => {
                step++;
                if (step === 1) { playSummary(currentIndex); }
                else if (step === 2) { playMoral(currentIndex); }
                else if (step === 3) { playStory(currentIndex); }
                else { switchCard('next'); step = -1; }
            }, 8000);
        }

        function stopAutoPlay() {
            autoPlaying = false;
            clearInterval(autoPlayTimer);
            document.querySelectorAll('.btn-auto').forEach(btn => { btn.textContent = '▶️ 自动循环'; btn.classList.remove('playing'); });
        }

        function startApp() {
            document.getElementById('startOverlay').style.display = 'none';
            XiaoDou.speak('欢迎来到小豆童话故事！', 'zh');
            showMascot('欢迎来到小豆童话故事！点击卡片，听好听的故事～');
        }

        let touchStartX = 0, touchEndX = 0;
        const mainStage = document.querySelector('.main-stage');
        if (mainStage) {
            mainStage.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            mainStage.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) { if (diff > 0) nextItem(); else prevItem(); }
            }, { passive: true });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextItem();
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevItem();
        });

        init();
    </script>
</body>
</html>
