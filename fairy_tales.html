<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小豆中文 - 童话故事</title>
        <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/flip-card.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        :root {
            --primary-color: #43A047;
            --bg-gradient: linear-gradient(135deg, #E8F5E9 0%, #FFF0F5 100%);
        }
    </style>
</head>
<body>
    <div class="kidlock-bar">
        <span>👶 儿童锁</span>
        <label class="kidlock-switch">
            <input type="checkbox" id="kidlockToggle" onchange="toggleKidLock(this.checked)">
            <span class="kidlock-slider"></span>
        </label>
    </div>


    <a href="index.html" class="back-bar">← 回首页</a>
    <div class="header">
        <h1>🐼 小豆中文</h1>
        <p>今天我们来一起听好故事，学道理</p>
    </div>
    <div class="mascot">
        <div class="mascot-bubble" id="mascotText">你好！点击卡片，听听怎么读～</div>
        <div class="mascot-avatar">🐼</div>
    </div>
    <div class="main-stage">
        <div id="cards"></div>
    </div>

    <script src="js/common.js"></script>
    <script>
        const PROGRESS_KEY = 'fairy_tales_progress';
        let items = [];
        let currentIndex = 0;
        let autoPlaying = false;
        let autoPlayStep = 0;

        async function init() {
            try {
                const data = await XiaoDou.loadModule('fairy_tales');
                items = XiaoDou.getItems(data);
                const saved = parseInt(localStorage.getItem(PROGRESS_KEY) || '0', 10);
                currentIndex = Math.max(0, Math.min(saved, items.length - 1));
                renderCards();
                showMascot('欢迎来到小豆童话故事！点击卡片，听好听的故事～');
            } catch (err) {
                console.error('加载数据失败:', err);
                document.querySelector('.main-stage').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#888;">童话故事数据加载失败，请刷新再试～</div>';
            }
        }

        function saveProgress() {
            try { localStorage.setItem(PROGRESS_KEY, String(currentIndex)); } catch (e) {}
        }

        function showMascot(text) { document.getElementById('mascotText').textContent = text; }

        function renderCards() {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            items.forEach((item, index) => {
                const wordsHtml = (item.words || []).map(w => `<span class="keyword" onclick="XiaoDou.speak('${XiaoDou.escapeHtml(w)}', 'zh')">${XiaoDou.escapeHtml(w)}</span>`).join('');
                const storyHtml = (item.story || '').split('\n').filter(p => p.trim()).map(p => `<p>${XiaoDou.escapeHtml(p)}</p>`).join('');
                const emoji = XiaoDou.escapeHtml(item.emoji || '📖');
                const card = document.createElement('div');
                card.className = 'card' + (index === currentIndex ? ' active' : '');
                card.id = 'card-' + index;
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <button class="side-arrow left" onclick="prevItem()">◀</button>
                    <div class="card-emoji" onclick="playTitle(${index})">${emoji}</div>
                        <button class="side-arrow right" onclick="nextItem()">▶</button>
                    </div>
                    <div class="card-title">${XiaoDou.escapeHtml(item.title)}</div>
                    <div class="card-subtitle">来源：${XiaoDou.escapeHtml(item.origin)}</div>
                    <div class="card-summary"><strong>简介：</strong>${XiaoDou.escapeHtml(item.summary)}</div>
                    <div class="card-story">${storyHtml}</div>
                    <div class="card-moral"><strong>道理：</strong>${XiaoDou.escapeHtml(item.moral)}</div>
                    <div class="keywords">${wordsHtml}</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="playTitle(${index})">🔊 标题</button>
                        <button class="btn btn-secondary" onclick="playSummary(${index})">📖 简介</button>
                        <button class="btn btn-fourth" onclick="playStory(${index})">📚 故事</button>
                        <button class="btn btn-third" onclick="playMoral(${index})">💡 道理</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-auto" id="autoBtn-${index}" onclick="toggleAutoPlay()">▶️ 自动循环</button>
                    </div>
                    <div class="progress" id="progress-${index}" style="margin-top:12px;"></div>
                `;
                container.appendChild(card);
            });
            renderProgressDots();
        }

        function renderProgressDots() {
            items.forEach((_, index) => {
                const dotsContainer = document.getElementById('progress-' + index);
                if (!dotsContainer) return;
                dotsContainer.innerHTML = '';
                items.forEach((_, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'progress-dot' + (i === currentIndex ? ' active' : '');
                    dot.style.cursor = 'pointer';
                    dot.title = '跳转到第 ' + (i + 1) + ' 个故事';
                    dot.onclick = () => jumpTo(i);
                    dotsContainer.appendChild(dot);
                });
            });
        }

        function jumpTo(index) {
            if (index === currentIndex || index < 0 || index >= items.length) return;
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;
            stopAutoPlay();
            cards[currentIndex].classList.remove('active');
            currentIndex = index;
            cards[currentIndex].classList.add('active');
            renderProgressDots();
            saveProgress();
            showMascot('《' + items[currentIndex].title + '》');
        }

        function playTitle(index) { XiaoDou.speak(items[index].title, 'zh'); showMascot('故事：《' + items[index].title + '》'); }
        function playSummary(index) { XiaoDou.speak(items[index].summary, 'zh'); showMascot(items[index].summary); }
        function playStory(index) { XiaoDou.speak(items[index].story, 'zh'); showMascot('正在朗读《' + items[index].title + '》...'); }
        function playMoral(index) { XiaoDou.speak(items[index].moral, 'zh'); showMascot('道理：' + items[index].moral); }

        function switchCard(direction) {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;
            cards[currentIndex].classList.remove('active');
            if (direction === 'next') currentIndex = (currentIndex + 1) % items.length;
            else currentIndex = (currentIndex - 1 + items.length) % items.length;
            cards[currentIndex].classList.add('active');
            renderProgressDots();
            saveProgress();
            const item = items[currentIndex];
            showMascot('《' + item.title + '》');
            stopAutoPlay();
        }
        function nextItem() { switchCard('next'); }
        function prevItem() { switchCard('prev'); }

        function updateAutoPlayBtn() {
            document.querySelectorAll('.btn-auto').forEach(btn => {
                btn.textContent = autoPlaying ? '⏹️ 停止循环' : '▶️ 自动循环';
                btn.classList.toggle('playing', autoPlaying);
            });
        }

        function runAutoStep() {
            if (!autoPlaying) return;
            const item = items[currentIndex];
            autoPlayStep++;
            if (autoPlayStep === 1) {
                const u = playSummaryUtter(currentIndex);
                if (u) u.onend = () => runAutoStep();
                else runAutoStep();
            } else if (autoPlayStep === 2) {
                const u = playMoralUtter(currentIndex);
                if (u) u.onend = () => runAutoStep();
                else runAutoStep();
            } else if (autoPlayStep === 3) {
                const u = playStoryUtter(currentIndex);
                if (u) {
                    u.onend = () => {
                        setTimeout(() => {
                            if (!autoPlaying) return;
                            switchCard('next');
                            autoPlayStep = 0;
                            setTimeout(() => {
                                if (!autoPlaying) return;
                                const u = playTitleUtter(currentIndex);
                                if (u) u.onend = () => runAutoStep();
                                else runAutoStep();
                            }, 500);
                        }, 800);
                    };
                } else {
                    setTimeout(() => { if (autoPlaying) switchCard('next'); autoPlayStep = 0; }, 800);
                }
            }
        }

        function makeUtter(text, lang) {
            if (!window.speechSynthesis || !text) return null;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang === 'ja' ? 'ja-JP' : (lang === 'en' ? 'en-US' : 'zh-CN');
            utter.rate = 0.85;
            utter.pitch = 1.1;
            const voices = window.speechSynthesis.getVoices() || [];
            const voice = voices.find(v => v.lang === 'zh-CN') || voices.find(v => v.lang.startsWith('zh')) || null;
            if (voice) utter.voice = voice;
            return utter;
        }

        function speakUtter(utter, beforeSpeak) {
            if (!utter) return false;
            if (beforeSpeak) beforeSpeak();
            window.speechSynthesis.speak(utter);
            return true;
        }

        function playTitleUtter(index) {
            const u = makeUtter(items[index].title, 'zh');
            return speakUtter(u, () => showMascot('故事：《' + items[index].title + '》')) ? u : null;
        }
        function playSummaryUtter(index) {
            const u = makeUtter(items[index].summary, 'zh');
            return speakUtter(u, () => showMascot(items[index].summary)) ? u : null;
        }
        function playStoryUtter(index) {
            const u = makeUtter(items[index].story, 'zh');
            return speakUtter(u, () => showMascot('正在朗读《' + items[index].title + '》...')) ? u : null;
        }
        function playMoralUtter(index) {
            const u = makeUtter(items[index].moral, 'zh');
            return speakUtter(u, () => showMascot('道理：' + items[index].moral)) ? u : null;
        }

        function toggleAutoPlay() {
            if (autoPlaying) { stopAutoPlay(); return; }
            autoPlaying = true;
            autoPlayStep = 0;
            updateAutoPlayBtn();
            showMascot('开始自动朗读《' + items[currentIndex].title + '》...');
            const u = playTitleUtter(currentIndex);
            if (u) u.onend = () => runAutoStep();
            else runAutoStep();
        }

        function stopAutoPlay() {
            autoPlaying = false;
            autoPlayStep = 0;
            try { window.speechSynthesis.cancel(); } catch (e) {}
            updateAutoPlayBtn();
        }

        function startApp() {
            XiaoDou.speak('欢迎来到小豆童话故事！', 'zh');
            showMascot('欢迎来到小豆童话故事！点击卡片，听好听的故事～');
        }

        let touchStartX = 0, touchEndX = 0;
        const mainStage = document.querySelector('.main-stage');
        if (mainStage) {
            mainStage.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            mainStage.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (kidLockOn) return; // 儿童锁
                if (Math.abs(diff) > 60) { if (diff > 0) nextItem(); else prevItem(); }
            }, { passive: true });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextItem(); }
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevItem(); }
        });

        // ========== 儿童锁 ==========
        const KIDLOCK_KEY = 'fairy_tales_kidlock';
        let kidLockOn = false;

        function toggleKidLock(on) {
            kidLockOn = !!on;
            try { localStorage.setItem(KIDLOCK_KEY, kidLockOn ? '1' : '0'); } catch (e) {}
            document.body.classList.toggle('kidlock', kidLockOn);
            if (typeof showMascot === 'function') {
                showMascot(kidLockOn
                    ? '儿童锁开启！页面锁住了，用两边的大箭头翻页～'
                    : '儿童锁关闭。');
            }
        }

        function initKidLock() {
            let saved = null;
            try { saved = localStorage.getItem(KIDLOCK_KEY); } catch (e) {}
            const on = saved === '1';
            const toggle = document.getElementById('kidlockToggle');
            if (toggle) toggle.checked = on;
            document.body.classList.toggle('kidlock', on);
            kidLockOn = on;
        }


        init();


        initKidLock();
        startApp();
    </script>
</body>
</html>
